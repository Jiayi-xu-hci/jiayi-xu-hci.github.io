<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Projects — Jiayi Xu</title>
  <link rel="stylesheet" href="module.css">
</head>
<body>
  <main class="wrap">
    <header class="heading">
      <p class="eyebrow"><a href="../index.html">JIAYI XU</a> <span>RESEARCH</span></p>
      <h1>Ideas you can <em>feel.</em></h1>
      <p class="intro">Exploring how technology can sense, stimulate and extend the human body.</p>
    </header>
    <section aria-label="Research projects">
      <div class="toolbar">
        <nav id="filters" class="filters" aria-label="Browse projects by year"></nav>
        <span id="result-count" class="result-count" aria-live="polite"></span>
      </div>
      <div id="project-list"></div>
      <noscript><p>Enable JavaScript to browse the project cards and open their details.</p></noscript>
    </section>
    <footer class="review-note"><a href="../index.html#projects">← Back to homepage</a></footer>
  </main>
  <dialog id="project-dialog" aria-labelledby="detail-title" aria-describedby="detail-summary">
    <button class="close" type="button" aria-label="Close project details">×</button>
    <div id="detail-media" class="detail-media"></div>
    <div class="detail-body">
      <nav id="version-tabs" class="version-tabs" aria-label="Project studies and demonstrations" hidden></nav>
      <p id="detail-meta" class="detail-meta"></p>
      <h2 id="detail-title"></h2>
      <p id="detail-summary" class="detail-summary"></p>
      <div id="detail-text" class="detail-text"></div>
      <p id="detail-source" class="detail-source"></p>
      <div id="detail-links" class="detail-links"></div>
    </div>
  </dialog>
  <script src="projects.js"></script>
  <script src="module.js"></script>
</body>
</html>
