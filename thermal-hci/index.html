<style>
/* Three colours only: ink (text, greys are its tints), warm, cool. Fonts and sizes follow the homepage: Inter + Noto Sans; 44 / 26 / 18 / 16 / 14. */
:root{--bg:#fafaf8;--card:#fff;--ink:#1c2220;--muted:#6b7370;--line:#e6e8e6;--soft:#f1f2f0;--warm:#e2601a;--cool:#2a7fd4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121514;--card:#191d1c;--ink:#e9eeec;--muted:#9ba5a2;--line:#2a302e;--soft:#202624;--warm:#ff8a4c;--cool:#6bb6ff}}
:root[data-theme="dark"]{--bg:#121514;--card:#191d1c;--ink:#e9eeec;--muted:#9ba5a2;--line:#2a302e;--soft:#202624;--warm:#ff8a4c;--cool:#6bb6ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,"Noto Sans JP","Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

html[lang=zh] body{font-family:Inter,"Noto Sans SC","Noto Sans JP",system-ui,sans-serif}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}

h1,h2,h3,p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

header.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-size:16px;font-weight:700;white-space:nowrap;text-decoration:none}
.brand span{color:var(--warm)} .brand b{color:var(--cool);font-weight:700}
nav.toc{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.toc::-webkit-scrollbar{display:none}
nav.toc a{font-size:14px;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap}
nav.toc a:hover{color:var(--ink)}
.lang{display:flex;gap:2px}
.lang button{border:0;background:none;color:var(--muted);font:600 14px Inter,sans-serif;padding:6px 8px;cursor:pointer;border-radius:6px}
.lang button.on{color:var(--ink);background:var(--soft)}
/* hero */
.hero{padding:96px 0 56px}
.kicker,.chip{display:block;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:44px;line-height:1.2;letter-spacing:-.03em;margin:16px 0 20px;font-weight:700}
.hero p.lead{font-size:18px;color:var(--muted);max-width:720px}
.stats{margin:20px 0 28px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink);font-family:inherit}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:hover{color:inherit;opacity:.85}
.video{margin-top:40px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9}
.video video{width:100%;height:100%;display:block}
.video.missing{display:none}
/* emphasis: warm for key words, cool only where the meaning is cold */
em{font-style:normal;color:var(--warm)} i{font-style:normal;color:var(--cool)}
/* sections */
section.sec{padding:80px 0;border-top:1px solid var(--line)}
h2{font-size:26px;line-height:1.3;letter-spacing:-.015em;margin:12px 0 16px;font-weight:700}
.sec>.wrap>p.lead{font-size:16px;color:var(--muted);max-width:760px;margin:0 0 36px}
.sec h3{font-size:18px;line-height:1.4;font-weight:600}
.sub{margin:48px 0 16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.card h3{margin:0 0 8px}
.card p{color:var(--muted);font-size:16px}
.modes svg.mode{width:100%;height:84px;display:block;margin:-4px 0 10px}
svg.mode .sk{fill:#f2d3bc}svg.mode .pl{fill:var(--warm)}svg.mode .src{fill:var(--ink)}
svg.mode .dots circle{fill:var(--warm);animation:mdown 2.4s ease-in infinite}svg.mode .dots circle:nth-child(2){animation-delay:.8s}svg.mode .dots circle:nth-child(3){animation-delay:1.6s}
svg.mode .flow{fill:none;stroke:var(--cool);stroke-width:4;stroke-linecap:round;stroke-dasharray:12 10;animation:mflow 1.2s linear infinite}
svg.mode .ray{fill:none;stroke:var(--warm);stroke-width:3;stroke-dasharray:6 6;animation:mflow 1s linear infinite}
svg.mode .vap circle{fill:var(--cool);animation:mup 2.4s ease-out infinite}svg.mode .vap circle:nth-child(2){animation-delay:.8s}svg.mode .vap circle:nth-child(3){animation-delay:1.6s}
svg.mode .sw circle{fill:#fff;stroke:var(--ink);stroke-width:2.5;animation:msw 3s ease-in-out infinite}
@keyframes mdown{0%{transform:translateY(-14px);opacity:0}30%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes mup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-50px);opacity:0}}
@keyframes mflow{to{stroke-dashoffset:-44}}
@keyframes msw{0%,100%{fill:#fff}50%{fill:var(--warm)}}
@media (prefers-reduced-motion:reduce){svg.mode *{animation:none!important}}
.card.heat h3{color:var(--warm)} .card.cold h3{color:var(--cool)}
.card .try{margin-top:14px;font-size:14px;color:var(--ink);border-top:1px solid var(--line);padding-top:12px}
.cites{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.cite{font-size:14px;line-height:1.5;background:var(--soft);color:var(--muted);padding:1px 8px;border-radius:6px;border:0;cursor:pointer;font-family:inherit}
.cite:hover{color:var(--ink)}
.cite.own{color:var(--warm)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto;margin-top:32px}
.note{font-size:14px;color:var(--muted);margin-top:16px}
details.more{margin-top:24px}
details.more summary{cursor:pointer;font-size:14px;font-weight:600}
/* receptors */
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:0}
.rec div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.rec b{font-size:18px;font-weight:600}
.rec .h b{color:var(--warm)} .rec .c b{color:var(--cool)}
.rec p{margin-top:8px;color:var(--muted)}
/* timeline */
.tl{position:relative;margin-top:8px}
.tl:before{content:"";position:absolute;left:84px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl .ev{display:grid;grid-template-columns:68px 1fr;gap:32px;padding:8px 0;position:relative}
.tl .ev:before{content:"";position:absolute;left:80px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.tl .ev.h:before{background:var(--warm)} .tl .ev.c:before{background:var(--cool)}
.tl .yr{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
/* venue bars */
.bars{display:grid;gap:6px;margin-top:8px}
.barrow{display:grid;grid-template-columns:160px 1fr 40px;gap:12px;align-items:center;font-size:14px;cursor:pointer;border:0;background:none;color:inherit;text-align:left;font-family:inherit;padding:2px 0}
.barrow .b{height:10px;border-radius:5px;background:var(--line)}
.barrow.key .b{background:var(--warm)}
.barrow:hover span:first-child{color:var(--warm)}
/* library */
.search{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search input[type=search]{flex:1;min-width:240px;font:inherit;padding:11px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.filters select{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:220px}
.filters label{font-size:14px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.count{font-size:14px;color:var(--muted);margin:12px 0}
.res{display:grid;gap:0;border-top:1px solid var(--line)}
.item{padding:18px 0;border-bottom:1px solid var(--line)}
.item .tt{font-weight:600;line-height:1.45;text-decoration:none}
.item .mt{font-size:14px;color:var(--muted);margin:2px 0 6px}
.badges{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:14px;color:var(--muted)}
.bd.own{color:var(--warm)}
mark{background:color-mix(in srgb,var(--warm) 22%,transparent);color:inherit;border-radius:2px}
.morebtn{margin:24px auto 0;display:block}
footer{padding:48px 0 72px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.ver{margin-left:8px;font-size:14px;color:var(--muted)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:56px;max-width:1160px;margin:0 auto;padding:0 32px}
.barin{display:flex;align-items:center;gap:16px;height:60px;max-width:1160px;margin:0 auto;padding:0 32px}
.barin .lang{margin-left:0}
.tq{flex:1;max-width:380px;margin-left:auto;font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
.tq:focus,.search input[type=search]:focus{outline:none;border-color:var(--ink)}
.tocbtn{display:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit;font-family:inherit;padding:5px 12px;border-radius:8px;cursor:pointer}
.side{position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;padding:48px 0 32px;border-right:1px solid var(--line)}
.side-t{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.side ol{list-style:none;margin:0;padding:0}
.side a{display:flex;gap:12px;font-size:14px;line-height:1.5;text-decoration:none;color:var(--muted);padding:6px 16px 6px 0;border-right:2px solid transparent;margin-right:-1px}
.side a span{width:16px;color:var(--line);font-variant-numeric:tabular-nums;font-weight:600}
.side a:hover{color:var(--ink)}
.side a.on{color:var(--ink);border-right-color:var(--warm)} .side a.on span{color:var(--warm)}
.side-act{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap}
.side-act button{font:14px inherit;font-family:inherit;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
.side-act button:hover{color:var(--ink)}
main{min-width:0;max-width:760px}
.hero{padding:72px 0 56px}
section.sec{padding:0;border-top:1px solid var(--line)}
.chap-head{display:block;padding:40px 0 36px;cursor:pointer;position:relative}
.chap.fixed .chap-head{cursor:default}
.cnum{font-size:14px;font-weight:600;color:var(--warm);letter-spacing:.04em}
.chap-head h2{margin:8px 0 12px;padding-right:72px}
.chap-head .lead{font-size:16px;color:var(--muted);max-width:680px;margin:0}
.chap-head .tog{position:absolute;right:0;top:44px;font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.chap-head:hover .tog{color:var(--ink)}
.chap-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.chap.open .chap-body{grid-template-rows:1fr}
.chap-body>.inner{overflow:hidden;min-height:0}
.chap:not(.open) .chap-body>.inner{visibility:hidden;transition:visibility 0s .45s}
.chap-body .pad{padding:0 0 64px}
.chap-body .pad>.video:first-child{margin-top:0}
/* motion: short and quiet; switched off for reduced-motion users */
.prog{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--warm);transform-origin:0 50%;transform:scaleX(0)}
header.bar{position:sticky}
.hero h1::after{content:"";display:block;width:120px;height:4px;margin-top:22px;border-radius:2px;background:linear-gradient(90deg,var(--warm),var(--cool),var(--warm));background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){
.hero h1::after{animation:flow 8s ease-in-out infinite alternate}
@keyframes flow{to{background-position:100% 0}}
.hero>*{animation:up .7s ease both}
.hero>*:nth-child(2){animation-delay:.08s}.hero>*:nth-child(3){animation-delay:.16s}.hero>*:nth-child(4){animation-delay:.24s}.hero>*:nth-child(5){animation-delay:.32s}.hero>*:nth-child(6){animation-delay:.4s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.rv{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease}
.rv.in{opacity:1;transform:none}
.card{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,opacity .55s ease}
.card.rv{transition:transform .55s ease,border-color .25s ease,box-shadow .25s ease,opacity .55s ease}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ink) 18%,transparent);box-shadow:0 10px 28px rgba(0,0,0,.06)}
.chap-head .tog,.side a,.btn,.cite{transition:color .2s ease,border-color .2s ease,background .2s ease,opacity .2s ease}
}
@media (prefers-reduced-motion:reduce){.chap-body{transition:none}}
footer{padding:40px 0 72px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
@media (max-width:900px){.layout{display:block;padding:0 20px}.barin{padding:0 20px}.tocbtn{display:inline-block}
.side{position:fixed;top:60px;left:0;bottom:0;width:260px;height:auto;z-index:30;background:var(--bg);padding:24px 20px;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 0 100vmax transparent}

@media (max-width:560px){.brand{display:none}.tq{margin-left:0}}
@media (max-width:720px){.hero h1{font-size:34px}h2{font-size:22px}.barrow{grid-template-columns:110px 1fr 34px}.tl:before{left:58px}.tl .ev{grid-template-columns:44px 1fr;gap:28px}.tl .ev:before{left:54px}}
</style>

S.push({id:'why',nav:L3('为什么','なぜ温度','Why'),chip:L3('为什么是温度','なぜ温度なのか','Why temperature'),
title:L3('辣椒为什么“烫”，薄荷为什么“凉”？<br>这个问题拿了*诺贝尔奖*。','唐辛子はなぜ「熱く」、ミントはなぜ「涼しい」？<br>この問いが*ノーベル賞*に。','Why does chili feel *hot* and mint feel _cool_?<br>That question won a *Nobel Prize*.'),
lead:L3('2021 年诺贝尔生理学或医学奖颁给了 David Julius 和 Ardem Patapoutian，理由是“发现了温度和触觉的受体”。皮肤里有专门感受热和冷的分子开关，辣椒素和薄荷醇正好能把它们打开。','2021年のノーベル生理学・医学賞は、「温度と触覚の受容体の発見」でデビッド・ジュリアスとアーデム・パタプティアンに贈られました。皮膚には熱さと冷たさを感じる分子のスイッチがあり、カプサイシンやメントールはそれを直接オンにします。','The 2021 Nobel Prize in Physiology or Medicine went to David Julius and Ardem Patapoutian “for their discoveries of receptors for temperature and touch”. Our skin has molecular switches for heat and cold, and chili (capsaicin) and mint (menthol) flip them directly.'),
body:{zh:`<div class="rec"><div class="h"><b>TRPV1 · 热 / 辣椒</b><p>大约 43 °C 以上开始响应，辣椒素也能打开它。{{caterina1997trpv1}}</p></div><div class="c"><b>TRPM8 · 冷 / 薄荷</b><p>感受凉意，薄荷醇也能打开它。{{mckemy2002trpm8}} {{peier2002trpm8}}</p></div></div>
<h3 class="sub">温度为什么重要？</h3>
<div class="grid">
<div class="card heat"><h3>它告诉身体：热量在进还是在出</h3><p>烫伤和冻伤的警报都来自温度感觉。人能察觉非常小的温度变化，但前提是变化不能太慢。{{filingeri2016neurophysiology}}</p></div>
<div class="card cold"><h3>它帮我们认识东西</h3><p>同样是室温，金属摸起来比木头凉，因为金属把手上的热量带走得更快。{{ho2008model}} {{bergmanntiest2009diffusivity}}</p></div>
<div class="card"><h3>它和心情连在一起</h3><p>我们说“热情”“冷淡”。不过，“握一杯热饮会让人更友善”的著名实验，后来的大规模重复并没有得到同样结果。科学要看证据。{{williams2008warmth}} {{lynott2014replication}} {{chabris2019noevidence}}</p></div>
</div>
<h3 class="sub">如果电脑能给出冷和热，会怎样？</h3>
<div class="grid">
<div class="card"><h3>VR 里的阳光和风</h3><p>头戴设备吹出热风、凉风，让虚拟世界更真实。{{ranasinghe2017ambiotherm}} {{peiris2017thermovr}}</p></div>
<div class="card"><h3>隔着屏幕牵手</h3><p>远方的人握住设备，你的手心感到对方的温度。{{gooch2012itsneattofeeltheace7}}</p></div>
<div class="card"><h3>会变暖变凉的音乐</h3><p>耳机随音乐的高潮变暖、随安静段落变凉。{{watanabe2026thermotune}} {{xu2024moheat}}</p></div>
<div class="card"><h3>让假手重新感到冷热</h3><p>给截肢者的残肢加热或降温，他们感觉像是“消失的手”在碰到冷热。{{iberite2023restoration}}</p></div>
<div class="card"><h3>温暖的机器人</h3><p>柔软又温暖的机器人拥抱，更受人喜欢。{{block2018robothugs}} {{nie2012holdhand}}</p></div>
<div class="card"><h3>用冷热指路</h3><p>左边变暖就向左转，不用看屏幕也能导航。{{tewell2017heatnav}}</p></div>
</div>
<p class="note">这本手册按四个问题展开：我们怎样感觉冷热（感知、错觉）？机器怎样测量温度（传感）？怎样把冷热“送”给人（反馈）？可以用在哪里（应用）？</p>`,
ja:`<div class="rec"><div class="h"><b>TRPV1 · 熱 / 唐辛子</b><p>およそ43 °C以上で反応し、カプサイシンでもオンになります。{{caterina1997trpv1}}</p></div><div class="c"><b>TRPM8 · 冷 / ミント</b><p>涼しさを感じ、メントールでもオンになります。{{mckemy2002trpm8}} {{peier2002trpm8}}</p></div></div>
<h3 class="sub">温度はなぜ大切？</h3>
<div class="grid">
<div class="card heat"><h3>熱が入るか出るかを教えてくれる</h3><p>やけどや凍傷の警報は温度の感覚から来ます。人はとても小さな温度変化に気づけますが、変化がゆっくりすぎると気づきにくくなります。{{filingeri2016neurophysiology}}</p></div>
<div class="card cold"><h3>モノを見分ける手がかり</h3><p>同じ室温でも、金属は木より冷たく感じます。金属のほうが手の熱を速く奪うからです。{{ho2008model}} {{bergmanntiest2009diffusivity}}</p></div>
<div class="card"><h3>気持ちともつながる</h3><p>「温かい人」「冷たい態度」と言いますね。ただし「温かい飲み物を持つと人に親切になる」という有名な実験は、大規模な追試では再現されませんでした。証拠を見ることが大切です。{{williams2008warmth}} {{lynott2014replication}} {{chabris2019noevidence}}</p></div>
</div>
<h3 class="sub">コンピュータが冷たさ・温かさを出せたら？</h3>
<div class="grid">
<div class="card"><h3>VRの日差しと風</h3><p>ヘッドセットから温風や涼風が出て、仮想世界がもっとリアルに。{{ranasinghe2017ambiotherm}} {{peiris2017thermovr}}</p></div>
<div class="card"><h3>画面越しに手をつなぐ</h3><p>遠くの人がデバイスを握ると、あなたの手のひらにその温もりが届きます。{{gooch2012itsneattofeeltheace7}}</p></div>
<div class="card"><h3>温かくなる音楽</h3><p>サビで温かく、静かな部分で涼しくなるヘッドホン。{{watanabe2026thermotune}} {{xu2024moheat}}</p></div>
<div class="card"><h3>義手でもう一度冷温を</h3><p>切断した腕の残りの部分を温めたり冷やしたりすると、失った手で触れているように感じられます。{{iberite2023restoration}}</p></div>
<div class="card"><h3>温かいロボット</h3><p>柔らかくて温かいロボットのハグは、より好まれました。{{block2018robothugs}} {{nie2012holdhand}}</p></div>
<div class="card"><h3>冷温で道案内</h3><p>左が温かくなったら左へ。画面を見ずにナビゲーション。{{tewell2017heatnav}}</p></div>
</div>
<p class="note">このハンドブックは4つの問いで進みます。人はどう冷温を感じる？（知覚・錯覚）機械はどう測る？（センシング）どう人に届ける？（フィードバック）どこで使える？（応用）</p>`,
en:`<div class="rec"><div class="h"><b>TRPV1 · heat / chili</b><p>Responds above about 43 °C, and capsaicin from chili also switches it on. {{caterina1997trpv1}}</p></div><div class="c"><b>TRPM8 · cold / mint</b><p>Senses coolness, and menthol from mint also switches it on. {{mckemy2002trpm8}} {{peier2002trpm8}}</p></div></div>
<h3 class="sub">Why does temperature matter?</h3>
<div class="grid">
<div class="card heat"><h3>It tells the body whether heat is coming in or going out</h3><p>Warnings of burns and frostbite come from temperature sense. We notice tiny changes, but only if they are not too slow. {{filingeri2016neurophysiology}}</p></div>
<div class="card cold"><h3>It helps us recognise things</h3><p>At the same room temperature, metal feels colder than wood because it pulls heat from your hand faster. {{ho2008model}} {{bergmanntiest2009diffusivity}}</p></div>
<div class="card"><h3>It is tied to feelings</h3><p>We say “warm-hearted” and “a cold welcome”. But the famous finding that holding a hot drink makes people friendlier did not hold up in large repeat studies. Evidence matters. {{williams2008warmth}} {{lynott2014replication}} {{chabris2019noevidence}}</p></div>
</div>
<h3 class="sub">What if computers could give us warm and cold?</h3>
<div class="grid">
<div class="card"><h3>Sun and wind in VR</h3><p>Headsets blow warm or cool air to make virtual worlds feel real. {{ranasinghe2017ambiotherm}} {{peiris2017thermovr}}</p></div>
<div class="card"><h3>Holding hands at a distance</h3><p>Someone far away squeezes a device and your palm feels their warmth. {{gooch2012itsneattofeeltheace7}}</p></div>
<div class="card"><h3>Music that warms and cools</h3><p>Headphones that warm up at the chorus and cool down in quiet parts. {{watanabe2026thermotune}} {{xu2024moheat}}</p></div>
<div class="card"><h3>Feeling hot and cold again</h3><p>Warming or cooling the arm of amputees made them feel temperature in their missing hand. {{iberite2023restoration}}</p></div>
<div class="card"><h3>Warm robots</h3><p>Robot hugs were liked more when the robot was soft and warm. {{block2018robothugs}} {{nie2012holdhand}}</p></div>
<div class="card"><h3>Directions by warmth</h3><p>Your left side warms up, so you turn left—no screen needed. {{tewell2017heatnav}}</p></div>
</div>
<p class="note">The handbook follows four questions: how do we feel hot and cold (perception, illusions)? How do machines measure temperature (sensing)? How can we send warmth and coolness to people (feedback)? Where can it be used (applications)?</p>`}});

S.push({id:'perception',cat:'perception',nav:L3('感知','知覚','Perception'),chip:L3('第一部分 · 感知','第1部 · 知覚','Part 1 · Perception'),
title:L3('皮肤更在意温度的*变化*','皮膚は温度の*変化*に敏感','Skin cares about *changes* in temperature'),
lead:L3('皮肤里分别有感“冷”和感“暖”的神经末梢。它们对温度的变化最敏感：变得太慢，就感觉不到；泡得太久，就习惯了。','皮膚には「冷たい」と「温かい」を感じる神経の先端が別々にあります。温度の変化にいちばん敏感で、変化がゆっくりだと気づかず、長く続くと慣れてしまいます。','Skin has separate nerve endings for cool and warm. They react most to change: too slow and you miss it, too long and you get used to it.'),
body:{zh:`<div class="grid">
<div class="card"><h3>大约 15–42 °C 不会疼</h3><p>超过约 43 °C，热痛受体开始工作。{{filingeri2016neurophysiology}} {{caterina1997trpv1}}</p></div>
<div class="card cold"><h3>冷比热更容易察觉</h3><p>全身 300 多个点的测量显示，皮肤对凉的敏感度是暖的 1.3–1.6 倍。{{luo2020maps}}</p></div>
<div class="card"><h3>不同部位差很多</h3><p>脸最灵敏，脚最迟钝，相差约 100 倍；年龄越大越迟钝。{{stevens1998sensitivity}}</p></div>
<div class="card heat"><h3>太慢就感觉不到</h3><p>温度每秒变化小于约 0.1 °C 时，就很难发现。{{filingeri2016neurophysiology}} {{kenshalo1968warmandcoolthres05d9}}</p></div>
<div class="card"><h3>泡久了会习惯</h3><p>在 28–37.5 °C 之间，皮肤大约 25 分钟就会完全适应，不再觉得冷或热。{{kenshalo1966adaptation}}</p></div>
<div class="card"><h3>面积越大越明显，但说不准位置</h3><p>同样的温度，接触面积越大感觉越强；可人很难说清冷热到底在哪一点。{{hardy1937spatial}} {{stevens1971spatialsummation1cad}}</p></div>
</div>
<div class="grid two" style="margin-top:16px">
<div class="card"><h3>没有“湿”的感受器</h3><p>“湿”是大脑把“凉”和“轻轻的压”合在一起猜出来的。{{filingeri2014wet}}</p></div>
<div class="card"><h3>金属凉、木头暖</h3><p>摸东西时，手上的热量流走得越快，就觉得越凉；这是我们分辨材质的线索。{{ho2008model}} {{bergmanntiest2009diffusivity}}</p></div>
</div>`,
ja:`<div class="grid">
<div class="card"><h3>約15〜42 °Cなら痛くない</h3><p>約43 °Cを超えると熱の痛みの受容体が働き始めます。{{filingeri2016neurophysiology}} {{caterina1997trpv1}}</p></div>
<div class="card cold"><h3>冷たさの方が気づきやすい</h3><p>全身300点以上の測定で、冷たさへの感度は温かさの1.3〜1.6倍でした。{{luo2020maps}}</p></div>
<div class="card"><h3>体の場所で大きく違う</h3><p>顔がいちばん敏感で足がいちばん鈍く、約100倍の差。年齢とともに鈍くなります。{{stevens1998sensitivity}}</p></div>
<div class="card heat"><h3>ゆっくりだと気づかない</h3><p>1秒あたり約0.1 °Cより遅い変化は気づきにくくなります。{{filingeri2016neurophysiology}} {{kenshalo1968warmandcoolthres05d9}}</p></div>
<div class="card"><h3>長く続くと慣れる</h3><p>28〜37.5 °Cの間なら、約25分で完全に慣れて冷温を感じなくなります。{{kenshalo1966adaptation}}</p></div>
<div class="card"><h3>広いほど強いが、場所はあいまい</h3><p>触れる面積が大きいほど強く感じますが、どこが冷たいのかは正確にわかりにくいのです。{{hardy1937spatial}} {{stevens1971spatialsummation1cad}}</p></div>
</div>
<div class="grid two" style="margin-top:16px">
<div class="card"><h3>「濡れ」の受容体はない</h3><p>「濡れている」は、脳が「冷たい」と「軽い圧」を組み合わせて推測した感覚です。{{filingeri2014wet}}</p></div>
<div class="card"><h3>金属は冷たく、木は温かい</h3><p>手の熱が速く逃げるほど冷たく感じ、それが材質を見分ける手がかりになります。{{ho2008model}} {{bergmanntiest2009diffusivity}}</p></div>
</div>`,
en:`<div class="grid">
<div class="card"><h3>About 15–42 °C feels pain-free</h3><p>Above about 43 °C, heat-pain receptors start to fire. {{filingeri2016neurophysiology}} {{caterina1997trpv1}}</p></div>
<div class="card cold"><h3>Cold is easier to notice</h3><p>Measured at 300+ points on the body, skin was 1.3–1.6 times more sensitive to cooling than to warming. {{luo2020maps}}</p></div>
<div class="card"><h3>Body sites differ a lot</h3><p>The face is most sensitive, the feet least—about 100-fold—and sensitivity drops with age. {{stevens1998sensitivity}}</p></div>
<div class="card heat"><h3>Too slow goes unnoticed</h3><p>Changes slower than about 0.1 °C per second are hard to detect. {{filingeri2016neurophysiology}} {{kenshalo1968warmandcoolthres05d9}}</p></div>
<div class="card"><h3>You get used to it</h3><p>Between 28 and 37.5 °C, skin fully adapts in about 25 minutes and stops feeling warm or cool. {{kenshalo1966adaptation}}</p></div>
<div class="card"><h3>Bigger feels stronger, but blurry</h3><p>A larger touch area feels stronger, yet we are poor at telling exactly where the warmth is. {{hardy1937spatial}} {{stevens1971spatialsummation1cad}}</p></div>
</div>
<div class="grid two" style="margin-top:16px">
<div class="card"><h3>There is no “wet” sensor</h3><p>Wetness is the brain’s guess from cooling plus light pressure. {{filingeri2014wet}}</p></div>
<div class="card"><h3>Metal feels cold, wood feels warm</h3><p>The faster heat leaves your hand, the colder it feels—a clue we use to tell materials apart. {{ho2008model}} {{bergmanntiest2009diffusivity}}</p></div>
</div>`}});

S.push({id:'illusions',cat:'illusion',nav:L3('错觉','錯覚','Illusions'),chip:L3('第二部分 · 错觉','第2部 · 錯覚','Part 2 · Illusions'),
title:L3('大脑也会被*温度*骗','脳も*温度*にだまされる','Your brain can be fooled by *temperature*'),
lead:L3('温度错觉不只是好玩：设计者用它们让设备更省电、更快，甚至“无中生有”。','温度の錯覚は面白いだけではありません。デバイスを省エネに、速く、そして「ないもの」を感じさせるために使われています。','Thermal illusions are not just fun: designers use them to make devices faster, cheaper and even to create feelings out of nothing.'),
cards:[
 {h:L3('热栅错觉','サーマルグリル錯覚','Thermal grill illusion'),p:L3('温和凉的细条交错排在一起，会感到“烫”甚至刺痛，虽然每一条都不烫。','温かい棒と冷たい棒を交互に並べると、どれも熱くないのに「熱い・痛い」と感じます。','Interlaced warm and cool bars can feel burning hot, though no single bar is hot.'),c:['craig1994grill','saga2022grill','mizuno2024dynapain'],k:'h'},
 {h:L3('热转移','サーマルリファーラル','Thermal referral'),p:L3('只加热中间一根手指，三根手指都觉得暖；设备可以用更少的发热点。','真ん中の指だけを温めても、3本とも温かく感じます。少ない発熱部で済みます。','Warm only the middle finger and all three touching fingers feel warm—fewer heaters needed.'),c:['green1977referral','ho2011referral','wang2024masking'],k:'h'},
 {h:L3('冷的更“重”','冷たいと「重い」','Cold feels heavier'),p:L3('两个一样重的东西，凉的那个感觉更重（韦伯在 19 世纪就注意到了）。','同じ重さでも、冷たいほうが重く感じます（19世紀にウェーバーが気づきました）。','Of two equal weights, the colder one feels heavier—first noticed by Weber in the 1800s.'),c:['kuhtzbuschbeck2020coldandheavy9ae3'],k:'c',t:L3('自己试试：把一枚硬币放冰箱几分钟，和另一枚一样的硬币放在手心比较。','やってみよう：硬貨1枚を冷蔵庫で数分冷やし、同じ硬貨と手のひらで比べてみよう。','Try it: chill one coin in the fridge for a few minutes and compare it with an identical coin on your palm.')},
 {h:L3('三碗水','3つのお椀','Three bowls of water'),p:L3('先适应的温度，决定了你对下一碗水的感觉：温度是“相对”的。','直前に慣れた温度で、次の水の感じ方が変わります。温度感覚は「相対的」です。','What you adapted to decides how the next bowl feels: temperature sense is relative.'),c:['kenshalo1966adaptation'],k:'c',t:L3('自己试试：左手放温水、右手放凉水一分钟，再一起放进常温水。','やってみよう：左手をぬるま湯、右手を冷水に1分入れ、両手を常温の水へ。','Try it: left hand in warm water, right hand in cool water for a minute, then both into room-temperature water.')},
 {h:L3('看见颜色、听见声音','色と音','Colours and sounds'),p:L3('红色让人以为更暖，蓝色更凉；倒热水和倒冷水的声音，人也能听出来。','赤は温かく、青は冷たく見えます。お湯と冷水を注ぐ音も聞き分けられます。','Red looks warm and blue cool; people can even hear whether hot or cold water is being poured.'),c:['ho2014colourtemperatur7828','ho2014combiningcoloura99b0','velasco2013thesoundoftempercdb1'],k:''},
 {h:L3('橡胶手让真手变凉','ラバーハンドで本物の手が冷える','A rubber hand cools your real hand'),p:L3('当人觉得假手是“自己的手”时，真手的皮肤温度竟然下降了。','偽物の手を「自分の手」と感じると、本物の手の皮膚温度が下がりました。','When people felt a rubber hand was theirs, the skin of their real hand actually cooled.'),c:['moseley2008psychologicallyi2647'],k:'c'},
 {h:L3('不湿也觉得湿','濡れていないのに濡れている','Wet without water'),p:L3('凉 + 轻压就能让手指觉得“湿”，VR 里可以模拟水。','冷たさ＋軽い圧で、指が「濡れた」と感じます。VRで水を表現できます。','Cool plus light pressure makes fingers feel wet—handy for water in VR.'),c:['filingeri2014wet','han2020mouill263b'],k:'c'},
 {h:L3('辣椒和薄荷','唐辛子とミント','Chili and mint'),p:L3('涂一点辣椒素或薄荷醇，不用加热制冷也能感到暖或凉。','カプサイシンやメントールを塗るだけで、加熱・冷却なしに温冷を感じます。','A dab of capsaicin or menthol feels warm or cool without any heater or cooler.'),c:['lu2021chemical','hensel1951menthol'],k:'h'},
 {h:L3('会移动的热','動く熱','Moving warmth'),p:L3('按顺序加热几个点，人会感觉热在皮肤上“流动”。','いくつかの点を順に温めると、熱が皮膚の上を「流れる」ように感じます。','Heating a few spots in sequence makes warmth seem to flow across the skin.'),c:['singhal2024flow'],k:'h'}
]});

S.push({id:'sensing',cat:'sensing',nav:L3('传感','センシング','Sensing'),chip:L3('第三部分 · 传感','第3部 · センシング','Part 3 · Sensing'),
title:L3('从玻璃管到贴在皮肤上的*电子皮肤*','ガラス管から肌に貼る*電子皮膚*へ','From glass tubes to *electronic skin*'),
lead:L3('400 年前，人们用一根玻璃管看空气热胀冷缩；今天，比纸还薄的传感器可以贴在皮肤上，机器人也能靠“摸”出的热量分辨材料。','400年前はガラス管で空気の膨張を見ていました。今では紙より薄いセンサを肌に貼り、ロボットは触れたときの熱で材質を見分けます。','Four centuries ago people watched air expand in a glass tube. Today sensors thinner than paper sit on skin, and robots tell materials apart by the heat they feel.'),
timeline:[
 ['1610s',L3('桑托里奥用早期温度计测体温，测温从“感觉”走向“数字”。','サントリオが初期の温度計で体温を測り、温度が「数値」に。','Santorio measures body heat with early thermometers: temperature becomes a number.'),'bigotti2018theweightoftheai1cf8','c'],
 ['1724',L3('华伦海特报告用温度计做的结冰实验。','ファーレンハイトが温度計による凍結実験を報告。','Fahrenheit reports freezing experiments with his thermometers.'),'fahrenheit1724viiiexperimentao32c1','c'],
 ['1821',L3('塞贝克发现两种金属接点受热会产生电：热电偶的原理。','ゼーベックが異種金属の接点を温めると電気が生じることを発見（熱電対の原理）。','Seebeck finds that heating a junction of two metals makes electricity—the thermocouple principle.'),'velmre2007thomasjohannseebeb64','h'],
 ['1880',L3('兰利发明测热辐射的“测辐射热计”。','ラングレーが熱放射を測るボロメータを発明。','Langley invents the bolometer for measuring heat radiation.'),'langley1880thebolometerandr4026','h'],
 ['1887',L3('卡伦德提出精确的铂电阻温度计。','カレンダーが精密な白金抵抗温度計を提案。','Callendar develops the precise platinum resistance thermometer.'),'callendar1887vionthepractical6722','c'],
 ['1946',L3('热敏电阻：温度一变，电阻就大变，便宜又灵敏。','サーミスタ：温度で抵抗が大きく変わる、安くて敏感なセンサ。','Thermistors: cheap parts whose resistance changes strongly with temperature.'),'becker1946propertiesandusebc9f','c'],
 ['2011',L3('“表皮电子”：像临时纹身一样贴在皮肤上的电路。','「表皮エレクトロニクス」：タトゥーシールのように肌に貼る回路。','Epidermal electronics: circuits that stick to skin like a temporary tattoo.'),'kim2011epidermalelectro1f2a','h'],
 ['2013',L3('超薄传感器连续、精确地测量皮肤温度。','超薄型センサで皮膚温度を連続・高精度に計測。','Ultrathin sensors measure skin temperature precisely and continuously.'),'webb2013ultrathinconform1136','h']],
cards:[
 {h:L3('热像仪变成触控板','サーモカメラがタッチパネルに','Thermal cameras as touch input'),p:L3('手指碰过的地方会留下“热手印”，热像仪看得见，于是任何表面都能变成触控面。','指が触れた所には「熱の跡」が残り、サーモカメラで見えるので、どんな面もタッチ面になります。','Fingers leave warm marks that a thermal camera can see, turning any surface into a touch pad.'),c:['larson2011heatwave0710','kurz2014thermaltouchf646']},
 {h:L3('机器人“摸”出材料','ロボットが触って材質を知る','Robots feel materials'),p:L3('像人一样，机器人根据接触时热量流走的快慢，分辨金属、木头和塑料。','人と同じように、触れたときの熱の逃げ方で金属・木・プラスチックを見分けます。','Like us, robots tell metal, wood and plastic apart by how fast heat flows on contact.'),c:['bhattacharjee2015materialrecognit671a','monkman1993thermaltactilese3f73']},
 {h:L3('看不见的心跳与情绪','見えない心拍と感情','Hidden signals in the face'),p:L3('非常灵敏的热成像能看到脸上极小的温度变化，用来读取生理状态。','とても高感度な熱画像で、顔のごく小さな温度変化から生理状態を読み取ります。','Highly sensitive thermal imaging sees tiny facial temperature changes linked to the body’s state.'),c:['kotani2025synchrothermograb7db','ring2012infraredthermali1457']}
]});

S.push({id:'feedback',cat:'feedback',nav:L3('反馈','フィードバック','Feedback'),chip:L3('第四部分 · 反馈','第4部 · フィードバック','Part 4 · Feedback'),
title:L3('把冷热送给人：*贴着*，或者_隔空_','冷温を届ける：*触れて*、または_離れて_','Sending warm and cool: *by touch* or _through the air_'),
lead:L3('最常见的是贴在皮肤上的“珀尔帖”小板（一通电就一面热一面冷）；也有用水、风、光、雾、超声，甚至辣椒素和错觉的方法。各有快慢、远近和安全上的取舍。','いちばん多いのは肌に当てる「ペルチェ素子」（電気を流すと片面が熱く、片面が冷たくなる板）。ほかに水・風・光・ミスト・超音波、さらには唐辛子成分や錯覚を使う方法も。速さ・距離・安全性にそれぞれ一長一短があります。','The most common tool is a Peltier element on the skin—a small plate that gets hot on one side and cold on the other when powered. Others use water, air, light, mist, ultrasound, even chili and illusions. Each trades off speed, distance and safety.'),
modes:{h:L3('先懂原理：热量有四种走法','まず原理：熱の伝わり方は4つ','First, the physics: four ways heat travels'),
 p:L3('不管是什么设备，热量进出皮肤只有几条路。知道是哪一条，就能猜到它快不快、要不要贴着皮肤、能不能降温。','どんな装置でも、熱が皮膚に出入りする道は限られています。どの道かが分かれば、速さ・接触の要否・冷やせるかが見えてきます。','Whatever the device, heat can only reach or leave the skin in a few ways. Knowing which one tells you how fast it is, whether it must touch, and whether it can cool.'),
 list:[
 {k:'cond',h:L3('传导：贴着传','伝導：触れて伝える','Conduction: by touch'),p:L3('两个东西贴在一起，热量从热的一方流向冷的一方。金属摸起来凉，就是因为它把手上的热量很快导走。珀尔帖片、水管、热电手套都靠它。','触れ合うと、熱は温かい方から冷たい方へ流れます。金属が冷たく感じるのは、手の熱を速く奪うから。ペルチェ素子・水流・熱電グローブはこれを使います。','When two things touch, heat flows from the warmer to the cooler one. Metal feels cold because it pulls heat from your hand quickly. Peltier plates, water tubes and thermal gloves all work this way.'),c:['ino1993display','hayakawa2015waterflow','kim2020glove','ho2018material']},
 {k:'conv',h:L3('对流：让风带着走','対流：風が運ぶ','Convection: carried by air'),p:L3('流动的空气（或水）把热量带过来或带走。吹风扇觉得凉就是对流。不用接触皮肤，但风也会被同时感觉到。','流れる空気（や水）が熱を運びます。扇風機で涼しいのが対流。肌に触れずに済みますが、風そのものも感じます。','Moving air (or water) carries heat to or away from the skin—that is why a fan feels cool. No contact is needed, but you feel the breeze too.'),c:['ranasinghe2017ambiotherm','xu2022vortex','akimoto2025coanda']},
 {k:'rad',h:L3('辐射：用光隔空送','放射：光で離れて届ける','Radiation: sent by light'),p:L3('光和红外线不需要任何介质，就能把能量送到皮肤上，就像晒太阳会觉得暖。适合隔空加热，但很难用它降温。','光や赤外線は何も介さずに皮膚へエネルギーを届けます。日なたが暖かいのと同じ。離れて温めるのは得意ですが、冷やすのは苦手です。','Light and infrared deliver energy across empty space—like feeling warm in the sun. Great for heating from afar, but hard to use for cooling.'),c:['saga2015heathapt','iwai2019noncontactthermod1f3','xu2023integration']},
 {k:'evap',h:L3('蒸发：变成气体时带走热','蒸発：気体になるとき熱を奪う','Evaporation: vapour takes heat away'),p:L3('液体在皮肤上变成气体时，会带走很多热量，所以出汗后吹风特别凉。把细雾或酒精送到皮肤上，就能隔空快速降温。','液体が皮膚の上で気体になると多くの熱を奪います。汗をかいて風に当たると涼しいのはこのため。ミストやアルコールを届ければ、離れたまま素早く冷やせます。','A liquid turning into vapour on the skin takes a lot of heat with it—why sweat in a breeze feels so cool. Delivering fine mist or alcohol cools quickly without contact.'),c:['nakajima2021mist','xu2026chillfactor']},
 {k:'chem',h:L3('另类：化学物质“骗”开关','番外：化学物質でスイッチをだます','A shortcut: chemicals trick the sensors'),p:L3('辣椒素和薄荷醇不改变皮肤温度，而是直接打开皮肤里的“热”和“冷”开关，所以严格说不是传热，但同样能带来冷热感。','カプサイシンやメントールは皮膚温度を変えず、皮膚の「熱」「冷」スイッチを直接オンにします。厳密には伝熱ではありませんが、冷温感を生みます。','Capsaicin and menthol leave skin temperature unchanged; they switch the heat and cold sensors on directly. Strictly not heat transfer—but you still feel warm or cool.'),c:['lu2021chemical','hamazaki2022chemicalinducedtd402']}
 ]},
mechs:[
 ['peltier',L3('通电后一面热一面冷的小板，贴在皮肤上。','電気で片面が熱く、片面が冷たくなる板を肌に当てる。','A plate that heats one side and cools the other, placed on skin.'),L3('能热也能冷，最普及','加熱も冷却もでき、最も普及','Heats and cools; most widely used'),L3('背面会积热，越用越慢','裏面に熱がたまり遅くなる','Heat builds up on the back and slows it down'),['ino1993display','jones2008warm','kim2020glove'],'h'],
 ['resistive_heating',L3('电流通过电阻丝发热，像电热毯。','電熱線に電流を流して発熱（電気毛布のように）。','Current through a wire makes heat, like an electric blanket.'),L3('简单、轻、便宜','シンプル・軽い・安い','Simple, light, cheap'),L3('只能加热，降温靠自然冷却','加熱のみ、冷却は自然まかせ','Heat only; cooling is slow'),['kuroda2024representationof0b7d'],'h'],
 ['fluid',L3('让热水或冷水在管子里流过皮肤。','温水や冷水を管に流して肌に届ける。','Hot or cold water flows through tubes against the skin.'),L3('温度稳、面积大','温度が安定、広い面に','Stable temperature over large areas'),L3('需要泵和水箱','ポンプやタンクが必要','Needs pumps and tanks'),['hayakawa2015waterflow'],'c'],
 ['air_convection',L3('吹出热风或冷风，不用碰到皮肤。','温風・冷風を吹き付け、肌に触れない。','Warm or cold air blown at the skin, no contact.'),L3('不接触、可大面积','非接触で広範囲','Contact-free, large areas'),L3('风的感觉会混进来','風の感覚が混ざる','You also feel the wind'),['ranasinghe2017ambiotherm','xu2022vortex','akimoto2025coanda'],'c'],
 ['radiation',L3('用红外灯、LED 或激光的光来加热皮肤。','赤外線ランプ・LED・レーザーの光で肌を温める。','Infrared lamps, LEDs or lasers warm the skin with light.'),L3('隔空、很快','離れていても速い','Fast, from a distance'),L3('只能加热，要注意安全','加熱のみ、安全に注意','Heat only; needs safety care'),['xu2023integration','xu2024moheat'],'h'],
 ['ultrasound',L3('超声波把细雾送到皮肤某一点，雾蒸发带走热量。','超音波でミストを一点に運び、蒸発で冷やす。','Ultrasound pushes mist to one spot where it evaporates and cools.'),L3('隔空的点状冷感','離れた点状の冷感','Pin-point cooling in mid-air'),L3('系统复杂','装置が複雑','Complex hardware'),['nakajima2021mist'],'c'],
 ['evaporative',L3('雾或酒精蒸发时带走热量，就像出汗后吹风。','ミストやアルコールが蒸発して熱を奪う（汗が乾くように）。','Mist or alcohol evaporating takes heat away, like sweat drying.'),L3('凉感强、反应快','強い冷感、速い','Strong, fast cooling'),L3('需要补充液体','液体の補充が必要','Needs refilling'),['xu2026chillfactor'],'c'],
 ['chemical',L3('涂辣椒素或薄荷醇，直接骗过温度受体。','カプサイシンやメントールで受容体を直接だます。','Capsaicin or menthol tricks the temperature receptors directly.'),L3('不耗电','電力がいらない','No power needed'),L3('不能快速开关','すぐにオン・オフできない','Hard to switch on and off'),['lu2021chemical'],'h'],
 ['illusion_based',L3('利用热转移、热栅等错觉，用更少的发热点做出更多感觉。','リファーラルやグリル錯覚で、少ない素子でより多くの感覚を。','Use referral or grill illusions to get more feeling from fewer heaters.'),L3('省电、省零件','省電力・部品削減','Saves power and parts'),L3('因人而异','個人差がある','Varies between people'),['wang2024masking','saga2022grill'],'']
],
table:{head:L3(['方式','碰皮肤？','加热','降温','典型用途'],['方式','触れる？','加熱','冷却','主な用途'],['Method','Touch?','Heat','Cool','Typical use']),
rows:[['peltier','✓','✓','✓',L3('手套、手柄、VR 头显','グローブ・コントローラ・HMD','Gloves, controllers, headsets')],['resistive_heating','✓','✓','—',L3('服装、座椅','衣服・座席','Clothing, seats')],['fluid','✓','✓','✓',L3('大面积、医疗','広い面・医療','Large areas, medicine')],['air_convection','—','✓','✓',L3('VR 环境、脸部','VR環境・顔','VR rooms, the face')],['radiation','—','✓','—',L3('隔空加热','離れて加熱','Contact-free warming')],['evaporative','—','—','✓',L3('隔空降温','離れて冷却','Contact-free cooling')],['chemical','✓','✓','✓',L3('可穿戴、低功耗','ウェアラブル・省電力','Wearables, low power')]]},
extra:{zh:`<p class="note">热显示的经典难题：要够快、不残留余热、要安全、要省电、还要能做得细。{{jones2008warm}} 最早用温度表现“材质手感”的显示器之一出现在 1993 年。{{ino1993display}}</p>`,ja:`<p class="note">温度ディスプレイの古典的な課題は、速さ・残熱のなさ・安全・省電力・細かさの両立です。{{jones2008warm}} 温度で「材質感」を表す最初期のディスプレイは1993年に登場しました。{{ino1993display}}</p>`,en:`<p class="note">The classic challenges of thermal displays: be fast, leave no leftover heat, stay safe, save power and still be detailed. {{jones2008warm}} One of the first displays to render the “feel” of materials by temperature appeared in 1993. {{ino1993display}}</p>`}});

S.push({id:'applications',cat:'application',nav:L3('应用','応用','Applications'),chip:L3('第五部分 · 应用','第5部 · 応用','Part 5 · Applications'),
title:L3('温度能用在*哪里*？','温度は*どこで*使える？','Where can temperature be *used*?'),
lead:L3('从游戏、音乐到医院和机器人。大多数还在实验室阶段，少数已经有临床或长期研究；我们把证据强弱也标了出来。','ゲームや音楽から病院、ロボットまで。多くはまだ研究段階で、臨床研究や長期研究があるものは一部です。証拠の強さも示しています。','From games and music to hospitals and robots. Most is still in the lab; a few areas have clinical or long-term evidence—we mark how strong the evidence is.'),
apps:[

  if(s.timeline) h+=`<div class="tl">${s.timeline.map(([y,t,id,k])=>`<div class="ev ${k||''}"><div class="yr">${y}</div><div class="tx">${tx(t)} ${chip(id)}</div></div>`).join('')}</div>`;
  if(s.cards) h+=`<div class="grid" style="margin-top:18px">${s.cards.map(c=>`<div class="card ${c.k==='h'?'heat':c.k==='c'?'cold':''}"><h3>${tx(c.h)}</h3><p>${tx(c.p)}</p>${c.t?`<div class="try">${tx(c.t)}</div>`:''}${cites(c.c)}</div>`).join('')}</div>`;
  if(s.modes) h+=`<h3 class="sub">${tx(s.modes.h)}</h3><p>${fill(tx(s.modes.p))}</p><div class="grid two modes">${s.modes.list.map(m=>`<div class="card"><svg class="mode m-${m.k}" viewBox="0 0 240 96" aria-hidden="true">${MODESVG[m.k]}</svg><h3>${tx(m.h)}</h3><p>${tx(m.p)}</p>${cites(m.c)}</div>`).join('')}</div><h3 class="sub">${tx(T.mechsH)}</h3>`;
  if(s.mechs) h+=`<div class="grid two">${s.mechs.map(([m,how,pro,con,c,k])=>{const n=LIB.filter(p=>p.m===m&&(p.c==='feedback'||p.c==='application'||p.c==='illusion')).length;return `<div class="card ${k==='h'?'heat':k==='c'?'cold':''}"><h3>${tx(MECH[m])}</h3><p>${tx(how)}</p>${cites(c)}</div>`}).join('')}</div>`;
  if(s.table){const hd=tx(s.table.head);h+=`<div class="tblwrap"><table class="tbl"><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr>${s.table.rows.map(r=>`<tr><td>${tx(MECH[r[0]])}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${tx(r[4])}</td></tr>`).join('')}</table></div>`}
  if(s.extra) h+=fill(tx(s.extra));
  if(s.apps) h+=`<div class="grid">${s.apps.map(([sub,ic,name,d,c,ev])=>{const n=LIB.filter(p=>p.s===sub).length;return `<div class="card"><h3>${tx(name)}</h3><p>${tx(d)}</p>${cites(c)}</div>`}).join('')}</div>`;
  if(s.venues) h+=venues();
  if(s.books) h+=books();
  if(s.cat) h+=seeAll('c',s.cat);
  return h+'</div></div></div></section>';
}
const OPEN=new Set(['why']);
const HASH=decodeURIComponent(location.hash.slice(1));if(HASH&&HASH!=='library'&&HASH!=='top')OPEN.add(HASH);
let CUR=HASH;
function syncURL(){const q=new URLSearchParams();q.set('lang',lang);const v=document.getElementById('q').value.trim();if(v)q.set('q',v);history.replaceState(null,'',location.pathname+'?'+q.toString()+(CUR?'#'+CUR:''))}
function setChap(id,on){const el=document.getElementById(id);if(!el||el.classList.contains('fixed'))return;on?OPEN.add(id):OPEN.delete(id);el.classList.toggle('open',on);const hd=el.querySelector('.chap-head');hd.setAttribute('aria-expanded',on);hd.querySelector('.tog').textContent=tx(on?T.collapse:T.expand);if(!on)el.querySelectorAll('video').forEach(v=>v.pause())}
const KEYV=['IEEE ToH','IEEE VR','ISMAR','Augmented Humans','CHI','UIST','Nature family','Science family','PNAS'];
function venues(){const c={};LIB.forEach(p=>{if(p.g)c[p.g]=(c[p.g]||0)+1});const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]);const mx=rows[0][1];
  return `<div class="bars">${rows.map(([g,n])=>`<button class="barrow${KEYV.includes(g)?' key':''}" data-g="${esc(g)}"><span>${esc(g)}</span><span class="b" style="width:${n/mx*100}%"></span><span>${n}</span></button>`).join('')}</div><p class="note">${tx(L3('橙色为重点来源。CHI EA = CHI 扩展摘要。数量为本资料库收录数，不代表该会议的全部温度论文。','オレンジは重点ソース。CHI EA は CHI 拡張アブストラクト。件数は本資料集の収録数で、その会議の温度論文すべてではありません。','Orange = key venues. CHI EA = CHI Extended Abstracts. Counts are what this library holds, not every thermal paper ever published there.'))}</p>`}
function books(){const B={};BOOKS.forEach(b=>B[b.i]=b);
  const rec=REC.filter(([i])=>B[i]).map(([i,d])=>{const b=B[i];return `<div class="card"><h3><a href="${esc(b.u)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(b.t)}</a></h3><p>${esc(b.a)} · ${esc(b.p)} · ${b.y}</p><p style="margin-top:8px;color:var(--ink)">${tx(d)}</p></div>`}).join('');
  const all=BOOKS.map(b=>`<tr><td><a href="${esc(b.u)}" target="_blank" rel="noopener">${esc(b.t)}</a></td><td>${esc(b.a)}</td><td>${b.y}</td><td>${esc(b.l).toUpperCase()}</td></tr>`).join('');
  return `<div class="grid">${rec}</div><details class="more"><summary>${tx(L3('全部 50 本书','50冊すべて','All 50 books'))}</summary><div class="tblwrap"><table class="tbl"><tr><th>${tx(L3('书名','書名','Title'))}</th><th>${tx(L3('作者','著者','Author'))}</th><th>${tx(L3('年','年','Year'))}</th><th>${tx(L3('语言','言語','Lang'))}</th></tr>${all}</table></div></details>`}

/* ---------------- library search ---------------- */
let shown=30;
const SUBN={};
function opt(sel,vals,label,fmt){const cur=sel.value;sel.innerHTML=`<option value="">${tx(label)}: ${tx(T.all)}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(fmt?fmt(v):v)}</option>`).join('');sel.value=vals.includes(cur)?cur:''}
function buildFilters(){
  const C=Object.keys(CAT);opt(fc,C,T.fCat,v=>tx(CAT[v]));
  const subs=[...new Set(LIB.filter(p=>!fc.value||p.c===fc.value).map(p=>p.s).filter(Boolean))].sort();opt(fs,subs,T.fSub,v=>v.replace(/_/g,' '));
  const ms=[...new Set(LIB.map(p=>p.m).filter(m=>m&&!['none','unknown'].includes(m)))].sort();opt(fm,ms,T.fMech,v=>MECH[v]?tx(MECH[v]):v);
  const gs=[...new Set(LIB.map(p=>p.g).filter(Boolean))].sort();opt(fg,gs,T.fVen);
  const ds=[...new Set(LIB.map(p=>p.y?Math.floor(p.y/10)*10:0).filter(Boolean))].sort((a,b)=>b-a).map(String);opt(fy,ds,T.fYear,v=>v+'s');
}
const norm=s=>(s||'').toLowerCase().normalize('NFKC');
LIB.forEach(p=>p._s=norm([p.t,p.a,p.v,p.g,p.zh,p.ja,p.en,p.k,p.c,p.s,p.m,p.y,p.i,CAT[p.c]?Object.values(CAT[p.c]).join(' '):'',MECH[p.m]?Object.values(MECH[p.m]).join(' '):''].join(' ')));
function search(reset){
  if(reset)shown=30;
  const q=norm(document.getElementById('q').value).trim(), terms=q.split(/\s+/).filter(Boolean);
  let r=LIB.filter(p=>(!fc.value||p.c===fc.value)&&(!fs.value||p.s===fs.value)&&(!fm.value||p.m===fm.value)&&(!fg.value||p.g===fg.value)&&(!fy.value||Math.floor(p.y/10)*10==fy.value)&&(!foa.checked||p.p)&&(!fown.checked||p.o)&&terms.every(t=>p._s.includes(t)));
  if(document.getElementById('q').dataset.id){const id=document.getElementById('q').dataset.id;r=LIB.filter(p=>p.i===id)}
  document.getElementById('count').textContent=tx(T.found).replace('{n}',r.length);
  const hl=s=>{s=esc(s);terms.forEach(t=>{if(t.length>1)s=s.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`)});return s};
  document.getElementById('res').innerHTML=r.slice(0,shown).map(p=>`<div class="item" id="p-${p.i}"><a class="tt" href="${esc(p.u)}" target="_blank" rel="noopener">${hl(p.t)}</a><div class="mt">${hl(p.a)} · ${p.y||''} · ${hl(p.v)}</div><div class="sm">${hl(p[lang]||p.en||p.zh)}</div><div class="badges"><span class="bd">${tx(CAT[p.c])}</span>${p.m&&MECH[p.m]?`<span class="bd">${tx(MECH[p.m])}</span>`:''}${p.g?`<span class="bd">${esc(p.g)}</span>`:''}${p.p?`<span class="bd">${tx(T.oa)}</span>`:`<span class="bd">${tx(T.nopdf)}</span>`}${p.o?`<span class="bd own">${tx(T.own)}</span>`:''}</div></div>`).join('');
  document.getElementById('more').style.display=r.length>shown?'block':'none';
}
function foot(){return tx({zh:`<b>温度，下一种交互语言</b><span class="ver">v0.1 · 2026-11</span><br>这是持续更新的工作版本，不是最终版。文献检索自 Crossref、Semantic Scholar、OpenAlex、DBLP、PubMed 等，每条都打开过题录页面核验；一句话摘要由编者用通俗语言概括，以原文为准。“无公开全文”表示我们没有找到合法的公开 PDF，不代表论文不可读。<br>编者：许佳禕（Jiayi Xu），东京大学先端科学技术研究中心。<br><br><b>引用本手册</b>：Jiayi Xu. <i>Thermal HCI Handbook</i>, v0.1, 2026. https://jiayi-xu-hci.github.io/thermal-hci/<br><b>版本记录</b>：v0.1（2026-11-04）首次公开：576 篇论文、50 本书、18 段视频。`,
ja:`<b>温度は、次のインタラクション言語</b><span class="ver">v0.1 · 2026-11</span><br>随時更新する作業版で、完成版ではありません。文献は Crossref・Semantic Scholar・OpenAlex・DBLP・PubMed などから収集し、各文献の書誌ページを開いて確認しました。一文要約は編者による平易な要約で、原文を優先してください。「全文非公開」は合法的な公開PDFが見つからなかったことを示します。<br>編者：許佳禕（Jiayi Xu）、東京大学先端科学技術研究センター。<br><br><b>引用</b>：Jiayi Xu. <i>Thermal HCI Handbook</i>, v0.1, 2026. https://jiayi-xu-hci.github.io/thermal-hci/<br><b>更新履歴</b>：v0.1（2026-11-04）初公開。論文576本、書籍50冊、動画18本。`,
en:`<b>Temperature, the Next Language of Interaction</b><span class="ver">v0.1 · 2026-11</span><br>A living working version, not a final edition. Sources were collected from Crossref, Semantic Scholar, OpenAlex, DBLP, PubMed and others, and each record was checked on its bibliographic page. One-line summaries are plain-language paraphrases by the editor—always defer to the original. “No open full text” means we found no legal open PDF, not that the paper cannot be read.<br>Editor: Jiayi Xu, RCAST, The University of Tokyo.<br><br><b>How to cite</b>: Jiayi Xu. <i>Thermal HCI Handbook</i>, v0.1, 2026. https://jiayi-xu-hci.github.io/thermal-hci/<br><b>Versions</b>: v0.1 (2026-11-04) first public release — 576 papers, 50 books, 18 videos.`})}

/* events */
const fc=document.getElementById('fc'),fs=document.getElementById('fs'),fm=document.getElementById('fm'),fg=document.getElementById('fg'),fy=document.getElementById('fy'),foa=document.getElementById('foa'),fown=document.getElementById('fown'),qi=document.getElementById('q');
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
[fc,fs,fm,fg,fy,foa,fown].forEach(e=>e.onchange=()=>{qi.dataset.id='';if(e===fc)buildFilters();search(true)});
qi.oninput=()=>{qi.dataset.id='';tq.value=qi.value;search(true);clearTimeout(qi._t);qi._t=setTimeout(syncURL,400)};
// top-bar search: mirrors the library box and brings the results into view once typing starts
const tq=document.getElementById('tq');
function toLibrary(){const lib=document.getElementById('library');if(lib.getBoundingClientRect().top>innerHeight*.5||lib.getBoundingClientRect().bottom<0){CUR='library';lib.scrollIntoView({behavior:'smooth'})}}
tq.oninput=()=>{qi.value=tq.value;qi.dataset.id='';search(true);if(tq.value.trim())toLibrary();clearTimeout(qi._t);qi._t=setTimeout(syncURL,400)};
tq.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();toLibrary()}};
document.getElementById('reset').onclick=()=>{qi.value='';tq.value='';qi.dataset.id='';[fc,fs,fm,fg,fy].forEach(s=>s.value='');foa.checked=fown.checked=false;buildFilters();search(true)};
document.getElementById('more').onclick=()=>{shown+=30;search()};
document.addEventListener('click',e=>{
  const c=e.target.closest('.cite');if(c){qi.value='';qi.dataset.id=c.dataset.id;[fc,fs,fm,fg,fy].forEach(s=>s.value='');search(true);document.getElementById('library').scrollIntoView();return}
  const s=e.target.closest('.seeall');if(s){qi.value='';qi.dataset.id='';[fc,fs,fm,fg,fy].forEach(x=>x.value='');if(s.dataset.f==='c'){fc.value=s.dataset.v;buildFilters()}else{fc.value=LIB.find(p=>p.s===s.dataset.v)?.c||'';buildFilters();fs.value=s.dataset.v}search(true);return}
  const ch=e.target.closest('.chap-head[data-id]');if(ch){const o=!OPEN.has(ch.dataset.id);setChap(ch.dataset.id,o);if(o){CUR=ch.dataset.id;syncURL()}return}
  const go=e.target.closest('[data-go]');if(go){e.preventDefault();setChap(go.dataset.go,true);CUR=go.dataset.go;syncURL();document.body.classList.remove('side-open');document.getElementById(go.dataset.go).scrollIntoView({behavior:'smooth'});return}
  const al=e.target.closest('[data-all]');if(al){S.forEach(x=>setChap(x.id,al.dataset.all==='1'));return}
  if(e.target.closest('#tocbtn')){document.body.classList.toggle('side-open');return}
  const v=e.target.closest('.barrow');if(v){qi.value='';qi.dataset.id='';[fc,fs,fm,fy].forEach(x=>x.value='');buildFilters();fg.value=v.dataset.g;search(true);document.getElementById('library').scrollIntoView()}
});
document.addEventListener('keydown',e=>{const ch=e.target.closest&&e.target.closest('.chap-head[data-id]');if(ch&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setChap(ch.dataset.id,!OPEN.has(ch.dataset.id))}});
if(QS.get('q'))document.getElementById('q').value=QS.get('q');
render();
if(CUR&&document.getElementById(CUR))setTimeout(()=>document.getElementById(CUR).scrollIntoView(),60);
// highlight the chapter whose header has reached the top of the screen (none while on the cover)
function mark(){let cur='';document.querySelectorAll('section.chap').forEach(x=>{if(x.getBoundingClientRect().top<160)cur=x.id});document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on',a.dataset.go===cur))}
function prog(){const h=document.documentElement;document.getElementById('prog').style.transform=`scaleX(${Math.min(1,h.scrollTop/Math.max(1,h.scrollHeight-innerHeight))})`}
addEventListener('scroll',()=>{mark();prog()},{passive:true});document.addEventListener('click',()=>setTimeout(mark,50));mark();
</script>
