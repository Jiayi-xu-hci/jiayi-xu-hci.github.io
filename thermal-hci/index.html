<style>
/* Three colours only: ink (text, greys are its tints), warm, cool. Fonts and sizes follow the homepage: Inter + Noto Sans; 44 / 26 / 18 / 16 / 14. */
:root{--bg:#fafaf8;--card:#fff;--ink:#1c2220;--muted:#6b7370;--line:#e6e8e6;--soft:#f1f2f0;--warm:#e2601a;--cool:#2a7fd4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121514;--card:#191d1c;--ink:#e9eeec;--muted:#9ba5a2;--line:#2a302e;--soft:#202624;--warm:#ff8a4c;--cool:#6bb6ff}}
:root[data-theme="dark"]{--bg:#121514;--card:#191d1c;--ink:#e9eeec;--muted:#9ba5a2;--line:#2a302e;--soft:#202624;--warm:#ff8a4c;--cool:#6bb6ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,"Noto Sans JP","Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[lang=ja] body{font-family:"Noto Sans JP",Inter,system-ui,sans-serif}
html[lang=zh] body{font-family:Inter,"Noto Sans SC","Noto Sans JP",system-ui,sans-serif}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{color:var(--warm)}
h1,h2,h3,p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
/* top bar */
header.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-size:16px;font-weight:700;white-space:nowrap;text-decoration:none}
.brand span{color:var(--warm)} .brand b{color:var(--cool);font-weight:700}
nav.toc{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.toc::-webkit-scrollbar{display:none}
nav.toc a{font-size:14px;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;white-space:nowrap}
nav.toc a:hover{color:var(--ink)}
.lang{display:flex;gap:2px}
.lang button{border:0;background:none;color:var(--muted);font:600 14px Inter,sans-serif;padding:6px 8px;cursor:pointer;border-radius:6px}
.lang button.on{color:var(--ink);background:var(--soft)}
/* hero */
.hero{padding:96px 0 56px}
.kicker,.chip{display:block;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:44px;line-height:1.2;letter-spacing:-.03em;margin:16px 0 20px;font-weight:700}
.hero p.lead{font-size:18px;color:var(--muted);max-width:720px}
.stats{margin:20px 0 28px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink);font-family:inherit}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:hover{color:inherit;opacity:.85}
.video{margin-top:40px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9}
.video video{width:100%;height:100%;display:block}
.video.missing{display:none}
/* emphasis: warm for key words, cool only where the meaning is cold */
em{font-style:normal;color:var(--warm)} i{font-style:normal;color:var(--cool)}
/* sections */
section.sec{padding:80px 0;border-top:1px solid var(--line)}
h2{font-size:26px;line-height:1.3;letter-spacing:-.015em;margin:12px 0 16px;font-weight:700}
.sec>.wrap>p.lead{font-size:16px;color:var(--muted);max-width:760px;margin:0 0 36px}
.sec h3{font-size:18px;line-height:1.4;font-weight:600}
.sub{margin:48px 0 16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.card h3{margin:0 0 8px}
.card p{color:var(--muted);font-size:16px}
.modes svg.mode{width:100%;height:84px;display:block;margin:-4px 0 10px}
svg.mode .sk{fill:#f2d3bc}svg.mode .pl{fill:var(--warm)}svg.mode .src{fill:var(--ink)}
svg.mode .dots circle{fill:var(--warm);animation:mdown 2.4s ease-in infinite}svg.mode .dots circle:nth-child(2){animation-delay:.8s}svg.mode .dots circle:nth-child(3){animation-delay:1.6s}
svg.mode .flow{fill:none;stroke:var(--cool);stroke-width:4;stroke-linecap:round;stroke-dasharray:12 10;animation:mflow 1.2s linear infinite}
svg.mode .ray{fill:none;stroke:var(--warm);stroke-width:3;stroke-dasharray:6 6;animation:mflow 1s linear infinite}
svg.mode .vap circle{fill:var(--cool);animation:mup 2.4s ease-out infinite}svg.mode .vap circle:nth-child(2){animation-delay:.8s}svg.mode .vap circle:nth-child(3){animation-delay:1.6s}
svg.mode .sw circle{fill:#fff;stroke:var(--ink);stroke-width:2.5;animation:msw 3s ease-in-out infinite}
@keyframes mdown{0%{transform:translateY(-14px);opacity:0}30%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes mup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-50px);opacity:0}}
@keyframes mflow{to{stroke-dashoffset:-44}}
@keyframes msw{0%,100%{fill:#fff}50%{fill:var(--warm)}}
@media (prefers-reduced-motion:reduce){svg.mode *{animation:none!important}}
.card.heat h3{color:var(--warm)} .card.cold h3{color:var(--cool)}
.card .try{margin-top:14px;font-size:14px;color:var(--ink);border-top:1px solid var(--line);padding-top:12px}
.cites{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.cite{font-size:14px;line-height:1.5;background:var(--soft);color:var(--muted);padding:1px 8px;border-radius:6px;border:0;cursor:pointer;font-family:inherit}
.cite:hover{color:var(--ink)}
.cite.own{color:var(--warm)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto;margin-top:32px}
.note{font-size:14px;color:var(--muted);margin-top:16px}
details.more{margin-top:24px}
details.more summary{cursor:pointer;font-size:14px;font-weight:600}
/* receptors */
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:0}
.rec div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.rec b{font-size:18px;font-weight:600}
.rec .h b{color:var(--warm)} .rec .c b{color:var(--cool)}
.rec p{margin-top:8px;color:var(--muted)}
/* timeline */
.tl{position:relative;margin-top:8px}
.tl:before{content:"";position:absolute;left:84px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl .ev{display:grid;grid-template-columns:68px 1fr;gap:32px;padding:8px 0;position:relative}
.tl .ev:before{content:"";position:absolute;left:80px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.tl .ev.h:before{background:var(--warm)} .tl .ev.c:before{background:var(--cool)}
.tl .yr{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
/* venue bars */
.bars{display:grid;gap:6px;margin-top:8px}
.barrow{display:grid;grid-template-columns:160px 1fr 40px;gap:12px;align-items:center;font-size:14px;cursor:pointer;border:0;background:none;color:inherit;text-align:left;font-family:inherit;padding:2px 0}
.barrow .b{height:10px;border-radius:5px;background:var(--line)}
.barrow.key .b{background:var(--warm)}
.barrow:hover span:first-child{color:var(--warm)}
/* AI notice */
.ainote{margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--warm);background:var(--card)}
/* tags */
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font:inherit;font-size:14px;line-height:1.3;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tags .tag{font-size:14px;padding:1px 9px 1px 7px;color:var(--muted)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:#c9cfcc;flex:none}
.tag.all::before{display:none}.tag span{color:var(--muted)}
.tag.g-s::before{background:var(--muted)}.tag.g-f::before{background:var(--warm)}.tag.g-x::before{background:var(--cool)}
.tag:hover{border-color:var(--ink);color:var(--ink)}.tag.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}.tag.on span{color:var(--bg)}
.meth{font-size:14px;color:var(--ink)!important;margin-top:8px}.meth b{font-weight:700}
/* keyword chips, tag rules */
.kws{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:14px;color:var(--muted);margin-top:6px}
.kw{font:inherit;font-size:14px;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.kw:hover{color:var(--warm);text-decoration-color:var(--warm)}
.rules{margin:0 0 12px;font-size:14px}.rules summary{cursor:pointer;color:var(--muted);font-size:14px}.rules summary:hover{color:var(--ink)}.rules p{margin:8px 0 0}
/* the chemical shortcut sits apart from the four heat routes */
.card.modes.alt{margin-top:16px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center;border-style:dashed}
.card.modes.alt svg.mode{margin:0}
@media (max-width:720px){.card.modes.alt{grid-template-columns:1fr;gap:8px}}
/* 30-second summary */
.tldr{margin:8px 0 24px;padding:16px 20px;border:1px solid var(--line);border-radius:12px;background:var(--card);max-width:720px}
.tldr-h{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--muted)}
.tldr ol{margin:0;padding-left:20px;font-size:16px;line-height:1.6}.tldr li{margin:4px 0}.tldr a{text-decoration:none;color:var(--ink)}.tldr a:hover b{text-decoration:underline}
.tldr b{color:var(--warm)}
/* faster heat */
.grid.three{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.fnum{margin:0 0 4px;font-size:26px;font-weight:800;color:var(--line)}
/* export, transcripts, open-problem links */
.count{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.exp button,.bibbtn{font:inherit;font-size:14px;background:none;border:1px solid var(--line);border-radius:6px;padding:0 8px;color:var(--muted);cursor:pointer}
.exp button:hover,.bibbtn:hover{color:var(--ink);border-color:var(--ink)}
details.ts{margin:-4px 0 16px;font-size:14px}details.ts summary{cursor:pointer;color:var(--muted)}details.ts summary:hover{color:var(--ink)}
details.ts ol{margin:8px 0 0;padding-left:20px;color:var(--muted);line-height:1.6}
.oqn{margin:8px 0 0}
/* appendix C: tools */
.disc{border-left:3px solid var(--line);padding-left:12px}
.tbar{margin-top:4px}.tbar .tag::before{display:none}.tgh{font-size:16px;margin:28px 0 12px;color:var(--muted)}
.tool .tm{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);margin-bottom:4px}
.tool h3 a{text-decoration:none}.tool h3 a:hover{text-decoration:underline}
.tst{white-space:nowrap}.tst.sale{color:var(--ink)}.tst.hist{color:var(--warm)}
.meth.warn{color:var(--muted)!important}
/* eras with milestones */
.eras{display:grid;gap:0;margin:8px 0 8px;border-top:1px solid var(--line)}
.era{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}
.era .eh h3{margin:0 0 8px}.era .eh p{font-size:16px;color:var(--muted);margin:0}
.era.heat .eh h3{color:var(--warm)}.era.cold .eh h3{color:var(--cool)}
.era .tl{margin-top:0}
.side .part{font-size:14px;color:var(--muted);font-weight:600;margin:16px 0 4px;letter-spacing:.02em}
@media (max-width:720px){.era{grid-template-columns:1fr;gap:12px}.filters select{flex:1 1 calc(50% - 8px);max-width:none;min-width:0}.tblwrap{overflow-x:auto}.tblwrap .tbl{min-width:600px}}
/* keyword network */
.net{margin-top:8px}.netbtns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.netbtns .btn{padding:6px 14px;font-size:14px}.netbtns .btn.on{border-color:var(--ink);color:var(--ink);font-weight:700}
#netsvg{width:100%;height:auto;display:block}.netwrap{overflow-x:auto}@media (max-width:720px){#netsvg{width:680px;max-width:none}}
#netsvg .ne{fill:none;stroke:var(--muted);stroke-linecap:round;transition:opacity .3s}#netsvg .ne.hi{stroke:var(--ink)}
#netsvg .nn{cursor:pointer;transition:opacity .3s}#netsvg .nn circle{stroke:var(--bg);stroke-width:2;transition:r .4s ease}
#netsvg .nn text{font-size:15px;font-weight:600;fill:var(--ink)}#netsvg .nn.sel text{font-weight:800}#netsvg .nn.sel circle{stroke:var(--ink);stroke-width:3}
#netsvg .g-p circle{fill:#c9cfcc}#netsvg .g-s circle{fill:var(--muted)}#netsvg .g-f circle{fill:var(--warm)}#netsvg .g-x circle{fill:var(--cool)}
#netinfo{min-height:3em}
/* year index */
.yrs{margin:16px 0 8px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.yrs-t{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.yrs-t b{font-size:16px}.yrs-t .ysel{font-size:14px;color:var(--cool);font-weight:700}
.yrs-t .tog{margin-left:auto;font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:2px 10px}.yrs-t:hover .tog{color:var(--ink)}
.yrs-b{display:none;padding-bottom:8px}.yrs.open .yrs-b{display:block}.yrs.just .yrs-b{animation:yin .3s ease}
@keyframes yin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.yrs-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:14px;color:var(--muted);margin-bottom:12px}
.ybars{display:flex;align-items:flex-end;gap:2px;height:150px}
.yb{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:var(--muted)}
.yb .n{font-size:14px;line-height:1;height:18px;font-variant-numeric:tabular-nums;color:var(--ink)}
.yb .col{position:relative;width:100%;height:100px}
.yb .a,.yb .b{position:absolute;left:12%;right:12%;bottom:0;border-radius:3px 3px 0 0;transition:height .4s ease}
.yb .a{background:var(--line)}.yb .b{background:var(--warm)}
.yb.on .b{background:var(--cool)}.yb.on .n{color:var(--cool);font-weight:700}
.yb:hover .b{opacity:.75}
.yb.pre{flex:1.6;margin-right:10px}
.yread{margin-left:auto;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.yb .yl{font-size:14px;height:20px;line-height:20px;white-space:nowrap;margin-top:6px;overflow:visible}
.yh{display:flex;gap:12px;align-items:baseline;padding:22px 0 6px;border-bottom:1px solid var(--line)}.yh b{font-size:18px}.yh span{font-size:14px;color:var(--muted)}
@media (max-width:720px){.yb .n{visibility:hidden}.yb.on .n{visibility:visible}.yb:not(.dec) .yl,.yb.pre+.yb .yl{visibility:hidden}.yb .yl{font-size:14px}}
/* library */
.search{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search input[type=search]{flex:1;min-width:240px;font:inherit;padding:11px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.filters select{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:220px}
.filters label{font-size:14px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.count{font-size:14px;color:var(--muted);margin:12px 0}
.res{display:grid;gap:0;border-top:1px solid var(--line)}
.item{padding:18px 0;border-bottom:1px solid var(--line)}
.item .tt{font-weight:600;line-height:1.45;text-decoration:none}
.item .mt{font-size:14px;color:var(--muted);margin:2px 0 6px}
.badges{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:14px;color:var(--muted)}
.bd.own{color:var(--warm)}
mark{background:color-mix(in srgb,var(--warm) 22%,transparent);color:inherit;border-radius:2px}
.morebtn{margin:24px auto 0;display:block}
footer{padding:48px 0 72px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.ver{margin-left:8px;font-size:14px;color:var(--muted)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:56px;max-width:1160px;margin:0 auto;padding:0 32px}
.barin{display:flex;align-items:center;gap:16px;height:60px;max-width:1160px;margin:0 auto;padding:0 32px}
.barin .lang{margin-left:0}
.tq{flex:1;max-width:380px;margin-left:auto;font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
.tq:focus,.search input[type=search]:focus{outline:none;border-color:var(--ink)}
.tocbtn{display:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit;font-family:inherit;padding:5px 12px;border-radius:8px;cursor:pointer}
.side{position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;padding:48px 0 32px;border-right:1px solid var(--line)}
.side-t{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.side ol{list-style:none;margin:0;padding:0}
.side a{display:flex;gap:12px;font-size:14px;line-height:1.5;text-decoration:none;color:var(--muted);padding:6px 16px 6px 0;border-right:2px solid transparent;margin-right:-1px}
.side a span{width:16px;color:var(--line);font-variant-numeric:tabular-nums;font-weight:600}
.side a:hover{color:var(--ink)}
.side a.on{color:var(--ink);border-right-color:var(--warm)} .side a.on span{color:var(--warm)}
.side-act{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap}
.side-act button{font:14px inherit;font-family:inherit;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
.side-act button:hover{color:var(--ink)}
main{min-width:0;max-width:760px}
.hero{padding:72px 0 56px}
section.sec{padding:0;border-top:1px solid var(--line)}
.chap-head{display:block;padding:40px 0 36px;cursor:pointer;position:relative}
.chap.fixed .chap-head{cursor:default}
.cnum{font-size:14px;font-weight:600;color:var(--warm);letter-spacing:.04em}
.chap-head h2{margin:8px 0 12px;padding-right:72px}
.chap-head .lead{font-size:16px;color:var(--muted);max-width:680px;margin:0}
.chap-head .tog{position:absolute;right:0;top:44px;font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.chap-head:hover .tog{color:var(--ink)}
.chap-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}

<section lang="en">
<h2 id="s-en-why">Why does chili feel hot and mint feel cool? That question won a Nobel Prize.</h2><p>The 2021 Nobel Prize in Physiology or Medicine went to David Julius and Ardem Patapoutian “for their discoveries of receptors for temperature and touch”. Our skin has molecular switches for heat and cold, and chili (capsaicin) and mint (menthol) flip them directly.</p>
<h2 id="s-en-perception">Skin cares about changes in temperature</h2><p>Skin has separate nerve endings for cool and warm. They react most to change: too slow and you miss it, too long and you get used to it.</p>
<ol><li>Skin cares about change. — How do we feel hot and cold? A few numbers every designer needs.</li><li>Receptors: Skin has molecular switches for heat and cold (TRPV1: Caterina et al. 1997 · TRPM8: McKemy et al. 2002; Peier et al. 2002)</li><li>Change: Change too slowly and we miss it (Changes slower than ~0.1 °C/s are hard to notice (Filingeri 2016; Kenshalo 1968))</li><li>Body map: Face most sensitive, feet least; cool is easier to notice than warm (Stevens &amp; Choo 1998; Luo et al. 2020)</li><li>Materials: Same room temperature—why does metal feel colder than wood? (Touching aluminium, glass, acrylic and foam for 20 s: faster heat loss feels colder — Schematic, redrawn after Ho, Temperature 2018, Fig. 3)</li><li>Fun fact: We have no sensor for wetness: wet = cool + light pressure. (Filingeri et al. 2014)</li><li>Feeling hot and cold is all about change.</li></ol>
<h2 id="s-en-illusions">Your brain can be fooled by temperature</h2><p>Thermal illusions are not just fun: designers use them to make devices faster, cheaper and even to create feelings out of nothing.</p>
<ol><li>Your brain can be fooled by temperature. — Thermal illusions are fun—and they make devices faster and cheaper.</li><li>Thermal grill: Warm and cool bars side by side can feel burning (Craig &amp; Bushnell 1994 — never try it at painful temperatures)</li><li>Thermal referral: Warm one finger and three feel warm (Green 1977; devices can use fewer heaters (Wang et al. 2024))</li><li>Try it: Two identical coins: the chilled one feels heavier. (Temperature–weight illusion, first noticed by Weber (Kuhtz-Buschbeck et al. 2020))</li><li>Three bowls: Temperature sense is relative</li><li>Seeing temperature: Just seeing fire or ice changes how warm you feel (Fire or ice worlds and hands in VR changed felt temperature and skin temperature — Schematic, redrawn after Kocur et al., CHI 2023)</li><li>Illusions are a designer’s magic.</li></ol>
<h2 id="s-en-sensing">From glass tubes to electronic skin</h2><p>Four centuries ago people watched air expand in a glass tube. Today sensors thinner than paper sit on skin, and robots tell materials apart by the heat they feel.</p>
<ol><li>From glass tubes to electronic skin. — How do machines measure temperature? A 400-year story.</li><li>History: Temperature went from a feeling to a number (Bigotti 2018; Fahrenheit 1724; Velmre 2007; Callendar 1887; Becker 1946; Kim 2011)</li><li>E-skin: Like skin, it senses temperature, pressure and more at once (A stretchable, skin-like sensor network — Schematic, redrawn after Hua et al., Nature Communications 2018)</li><li>Robots: Robots can feel metal from wood (Recognising materials from heat flow (Bhattacharjee et al. 2015))</li><li>Interaction: Warm fingerprints become touch input (HeatWave (CHI 2011); Thermal Touch (ISMAR 2014))</li><li>It’s not only thermometers that sense heat.</li></ol>
<h2 id="s-en-feedback">Sending warm and cool: by touch or through the air</h2><p>The most common tool is a Peltier element on the skin—a small plate that gets hot on one side and cold on the other when powered. Others use water, air, light, mist, ultrasound, even chili and illusions. Each trades off speed, distance and safety.</p>
<ol><li>Sending warm and cool. — Heat travels by touch, by air, by light, or by evaporation.</li><li>Two routes: Touching the skin, or through the air</li><li>Conduction: Way 1: heat by touch (Ino et al. 1993; Hayakawa et al. 2015; Kim et al. 2020)</li><li>Peltier: The most common contact device: hot on one side, cold on the other (Classic challenges of thermal displays (Jones &amp; Ho 2008))</li><li>Conduction · example: A flexible glove that cools 10 °C in under 0.5 s (Hot and cold touches when grabbing objects in VR — Schematic, redrawn after Kim et al., Scientific Reports 2020)</li><li>Convection: Way 2: heat carried by air (Ranasinghe et al. 2017; Xu et al. 2022; Akimoto et al. 2025)</li><li>Radiation: Way 3: heat sent by light (Saga et al. 2015; Iwai et al. 2019; Xu et al. 2023)</li><li>Evaporation: Way 4: cooling by evaporation (Nakajima et al. 2021; Xu et al. 2026)</li><li>Evaporation · example: Ultrasound sends mist to one spot, where it evaporates and cools (A pin-point cool spot without contact — Schematic, redrawn after Nakajima et al., IEEE ToH 2021)</li><li>Chemical: A shortcut: chemicals that trick the sensors (Lu et al. 2021 (UIST); Hamazaki et al. 2022)</li><li>The problem: Why do warm and cool always lag? (Skin and devices store heat: warming is fast, cooling slow, and heat lingers (Jones &amp; Ho 2008))</li><li>Speed-up 1 · perception: Split warm and cool into small tiles and it feels faster (Zhang et al. 2026 (UIST, TherMosaic); Sato et al. 2013)</li><li>Speed-up 2 · combine: Warm with light, cool with mist (Xu et al. 2024 (MoHeat); Xu et al. 2026 (ChillFactor, MoHeat Evo); Ichihashi et al. 2024 (UIST))</li><li>Speed-up 2 · our work: Steady cold air + brief light: cool that lasts (Contact-free cooling on the same patch of skin — Schematic, redrawn after Xu et al., IEEE ToH 2023)</li><li>Speed-up 3 · hardware: Prepare hot and cold, then flip to switch (Kang et al. 2024 (UIST, Flip-Pelt); Ichihashi et al. 2021 (infrared + shutter); Hayakawa et al. 2015 (switching water))</li><li>Compare: No perfect method—only the right one</li><li>Warm and cool can be designed.</li></ol>
<h2 id="s-en-applications">Where can temperature be used?</h2><p>From games and music to hospitals and robots. Most is still in the lab; a few areas have clinical or long-term evidence—we mark how strong the evidence is.</p>
<ol><li>Where can temperature go? — Games, emotions, medicine, robots—and how strong the evidence is.</li><li>Ten areas: Application studies in the library (Numbers = papers in this library)</li><li>Robots: Robot hugs are liked more when soft and warm (A robot given a soft, heated outfit — Schematic, redrawn after Block &amp; Kuchenbecker, Int. J. Social Robotics 2019)</li><li>Check the evidence: “Holding a hot drink makes you friendlier”? Large repeat studies did not find the same effect. (Williams &amp; Bargh 2008; Lynott et al. 2014; Chabris et al. 2019)</li><li>Maturity: Most are still in the lab; a few reach the clinic</li><li>Thermal applications have only just begun.</li></ol>
<h2 id="s-en-open">Next, it’s your turn</h2><p>Problems that keep coming up—and chances for new research.</p>
<h2 id="s-en-trends">From thermometers to a field that is heating up</h2><p>Laid out by year, the 576 studies grow from about 5 a year in the 2000s to about 47 a year since 2023—and the focus moves from how skin feels temperature to building it into devices and applications.</p>
<ol><li>300 years of thermal research. — All 576 studies in the library, laid out year by year.</li><li>Studies per year: The last ten years saw a rapid rise (About 5 a year in the 2000s, about 47 a year since 2023 (this library))</li><li>Four eras: From understanding skin to sending heat through the air</li><li>The shift: The focus moved from perception to devices and uses</li><li>Keyword network: VR, wearables and cross-modal are the new hub (26 topics found in titles, keywords and abstracts; a line joins two topics that appear in the same paper)</li><li>Heating up: Contact-free, illusion and application studies are all growing</li><li>A caveat: These are the 576 we collected—not everything. Newer papers are easier to find, and 2026 isn’t over.</li><li>Thermal research is heating up.</li></ol>
<h2 id="s-en-books">Want to go deeper?</h2><p>From popular books anyone can enjoy to research textbooks—50 titles, with details checked against library catalogues with AI assistance.</p>
<h2 id="s-en-tools">What do people actually use to measure and deliver temperature?</h2><p>Thirty-two measuring tools, lab stimulators and products you can already buy, grouped by use.</p>
</section>
<section lang="zh">
<h2 id="s-zh-why">辣椒为什么“烫”，薄荷为什么“凉”？ 这个问题拿了诺贝尔奖。</h2><p>2021 年诺贝尔生理学或医学奖颁给了 David Julius 和 Ardem Patapoutian，理由是“发现了温度和触觉的受体”。皮肤里有专门感受热和冷的分子开关，辣椒素和薄荷醇正好能把它们打开。</p>
<h2 id="s-zh-perception">皮肤更在意温度的变化</h2><p>皮肤里分别有感“冷”和感“暖”的神经末梢。它们对温度的变化最敏感：变得太慢，就感觉不到；泡得太久，就习惯了。</p>
<ol><li>皮肤更在意变化。 — 我们怎样感觉冷和热？几个设计者必须知道的数字。</li><li>受体：皮肤里有感“热”和感“冷”的分子开关（TRPV1：Caterina 等 1997 · TRPM8：McKemy 等 2002、Peier 等 2002）</li><li>变化：温度变得太慢，就感觉不到（每秒变化小于约 0.1 °C 时很难察觉（Filingeri 2016；Kenshalo 1968））</li><li>身体地图：脸最灵敏、脚最迟钝；凉比暖更容易察觉（Stevens &amp; Choo 1998；Luo 等 2020）</li><li>材质：同样是室温，为什么金属摸起来比木头凉？（摸铝、玻璃、亚克力、泡沫 20 秒：热量流得越快，越觉得凉 — 示意图，参考 Ho, Temperature 2018, Fig. 3 重画）</li><li>冷知识：人没有感受“湿”的器官： 湿 = 凉 + 轻轻的压。（Filingeri 等 2014）</li><li>感觉冷热，靠的是变化。</li></ol>
<h2 id="s-zh-illusions">大脑也会被温度骗</h2><p>温度错觉不只是好玩：设计者用它们让设备更省电、更快，甚至“无中生有”。</p>
<ol><li>大脑也会被温度骗。 — 这些错觉不只好玩，还能让设备更省电、更快。</li><li>热栅错觉：暖和凉交错排列，竟然觉得烫（Craig &amp; Bushnell 1994；请不要用会疼的温度尝试）</li><li>热转移：只热一根手指，三根都觉得暖（Green 1977；设备可以用更少的发热点（Wang 等 2024））</li><li>自己试试：两枚一样的硬币，冰过的那枚 感觉更重。（温度—重量错觉：Weber 在 19 世纪发现（Kuhtz-Buschbeck 等 2020））</li><li>三碗水：温度感觉是相对的</li><li>看见温度：只是看到火或冰，也会改变冷热感（火焰或冰的 VR 世界与手，改变了冷热感和皮肤温度 — 示意图，参考 Kocur et al., CHI 2023 重画）</li><li>错觉，是设计者的魔法。</li></ol>
<h2 id="s-zh-sensing">从玻璃管到贴在皮肤上的电子皮肤</h2><p>400 年前，人们用一根玻璃管看空气热胀冷缩；今天，比纸还薄的传感器可以贴在皮肤上，机器人也能靠“摸”出的热量分辨材料。</p>
<ol><li>从玻璃管到电子皮肤。 — 机器怎样测量温度？400 年的故事。</li><li>历史：测温，从“感觉”变成“数字”（Bigotti 2018；Fahrenheit 1724；Velmre 2007；Callendar 1887；Becker 1946；Kim 2011）</li><li>电子皮肤：像皮肤一样，能同时感觉温度、压力和更多（可拉伸的“皮肤式”传感网络 — 示意图，参考 Hua et al., Nature Communications 2018 重画）</li><li>机器人：机器人也能“摸”出金属和木头（靠热量流走的快慢识别材料（Bhattacharjee 等 2015））</li><li>交互：手指留下的热手印，变成触控（HeatWave（CHI 2011）；Thermal Touch（ISMAR 2014））</li><li>会测温的，不只是温度计。</li></ol>
<h2 id="s-zh-feedback">把冷热送给人：贴着，或者隔空</h2><p>最常见的是贴在皮肤上的“珀尔帖”小板（一通电就一面热一面冷）；也有用水、风、光、雾、超声，甚至辣椒素和错觉的方法。各有快慢、远近和安全上的取舍。</p>
<ol><li>把冷热送给人。 — 热量有几种走法：贴着传、被风带、被光送、被蒸发带走。</li><li>两条路：贴着皮肤，或者隔空</li><li>传导：第一种：贴着皮肤传热（Ino 等 1993；Hayakawa 等 2015；Kim 等 2020）</li><li>珀尔帖：最常见的传导元件：通电后一面热、一面冷（热显示的经典难题（Jones &amp; Ho 2008））</li><li>传导 · 例子：柔性手套：0.5 秒内降温 10 °C（VR 里触摸虚拟物体时给出冷热 — 示意图，参考 Kim et al., Scientific Reports 2020 重画）</li><li>对流：第二种：让风来传热（Ranasinghe 等 2017；Xu 等 2022；Akimoto 等 2025）</li><li>辐射：第三种：用光隔空传热（Saga 等 2015；Iwai 等 2019；Xu 等 2023）</li><li>蒸发：第四种：靠蒸发带走热（Nakajima 等 2021；Xu 等 2026）</li><li>蒸发 · 例子：超声波把雾送到手心一点，蒸发带走热量（不接触的点状冷感 — 示意图，参考 Nakajima et al., IEEE ToH 2021 重画）</li><li>化学：另类方法：用化学物质骗过温度开关（Lu 等 2021（UIST）；Hamazaki 等 2022）</li><li>难题：为什么冷热总是慢一拍？（皮肤和设备都会存热：加热快、降温慢，还会留下余热（Jones &amp; Ho 2008））</li><li>提速 1 · 感知：把冷热切成小块，感觉就变快了（Zhang 等 2026（UIST，TherMosaic）；Sato 等 2013）</li><li>提速 2 · 组合：用光加热、用雾降温，各取所长（Xu 等 2024（MoHeat）；Xu 等 2026（ChillFactor、MoHeat Evo）；Ichihashi 等 2024（UIST））</li><li>提速 2 · 我们的研究：冷风一直吹，光短暂加热：持续凉、几乎不留余冷（同一块皮肤上的非接触冷感 — 示意图，参考 Xu et al., IEEE ToH 2023 重画）</li><li>提速 3 · 硬件：提前备好冷和热，一翻就切换（Kang 等 2024（UIST，Flip-Pelt）；Ichihashi 等 2021（红外 + 快门）；Hayakawa 等 2015（冷热水切换））</li><li>对比：没有完美的方法，只有合适的方法</li><li>冷热，可以被设计。</li></ol>
<h2 id="s-zh-applications">温度能用在哪里？</h2><p>从游戏、音乐到医院和机器人。大多数还在实验室阶段，少数已经有临床或长期研究；我们把证据强弱也标了出来。</p>
<ol><li>温度能用在哪里？ — 娱乐、情感、医疗、机器人……以及证据有多强。</li><li>十个方向：资料库里的应用研究（数字是本资料库收录的论文数）</li><li>机器人：柔软又温暖的机器人拥抱，更受欢迎（给机器人加上柔软的外衣与加热垫 — 示意图，参考 Block &amp; Kuchenbecker, Int. J. Social Robotics 2019 重画）</li><li>要看证据：“握一杯热饮，会让人更友善”？ 大规模重复实验没能得到同样结果。（Williams &amp; Bargh 2008；Lynott 等 2014；Chabris 等 2019）</li><li>成熟度：大多数还在实验室，少数走到了临床</li><li>温度的应用，才刚刚开始。</li></ol>
<h2 id="s-zh-open">下一步，你来解决</h2><p>这些是领域里反复出现的难题，也是新研究的机会。</p>
<h2 id="s-zh-trends">从温度计，到正在升温的研究</h2><p>把资料库里的 576 篇研究按年份排开：2000 年代每年约 5 篇，2023 年以后每年约 47 篇；研究的重心也从“皮肤怎样感觉”，移到了“怎样把冷热做进设备和应用”。</p>
<ol><li>温度研究的三百年。 — 把资料库里的 576 篇研究按年份排开，看看大家在研究什么。</li><li>每年的研究：最近十年，研究数量快速增加（2000 年代每年约 5 篇，2023 年以后每年约 47 篇（本资料库））</li><li>四个时代：从了解皮肤，到隔空送冷热</li><li>重心转移：研究重心从感知移向设备与应用</li><li>关键词网络：关键词越连越紧：VR、可穿戴和跨感官成为中心（从标题、关键词和摘要中识别 26 个主题；两个主题出现在同一篇论文里就连一条线）</li><li>正在升温：非接触、错觉和应用研究，都在增加</li><li>读数据的提醒：这是我们收集的 576 篇，不是全部。 越新的论文越容易找到，2026 年还没结束。</li><li>温度研究，正在升温。</li></ol>
<h2 id="s-zh-books">想读得更深？</h2><p>从适合所有人的科普书，到研究者用的教科书。这里共收录 50 本，书目信息由 AI 协助在图书目录中核对。</p>
<h2 id="s-zh-tools">测温度、给冷热，现实中用什么？</h2><p>研究里常用的测温工具、温度刺激器，以及已经能买到的冷热产品，共 32 种，按用途分组。</p>
</section>
<section lang="ja">
<h2 id="s-ja-why">唐辛子はなぜ「熱く」、ミントはなぜ「涼しい」？ この問いがノーベル賞に。</h2><p>2021年のノーベル生理学・医学賞は、「温度と触覚の受容体の発見」でデビッド・ジュリアスとアーデム・パタプティアンに贈られました。皮膚には熱さと冷たさを感じる分子のスイッチがあり、カプサイシンやメントールはそれを直接オンにします。</p>
<h2 id="s-ja-perception">皮膚は温度の変化に敏感</h2><p>皮膚には「冷たい」と「温かい」を感じる神経の先端が別々にあります。温度の変化にいちばん敏感で、変化がゆっくりだと気づかず、長く続くと慣れてしまいます。</p>
<ol><li>皮膚は変化に敏感。 — 人はどう冷温を感じる？設計に欠かせない数字。</li><li>受容体：皮膚には「熱」と「冷」の分子スイッチがある（TRPV1：Caterina ら 1997 · TRPM8：McKemy ら 2002、Peier ら 2002）</li><li>変化：ゆっくりすぎる変化は感じない（1秒あたり約0.1 °C未満の変化は気づきにくい（Filingeri 2016；Kenshalo 1968））</li><li>体の地図：顔が最も敏感、足が最も鈍い。冷たさのほうが気づきやすい（Stevens &amp; Choo 1998；Luo ら 2020）</li><li>材質：同じ室温でも、なぜ金属は木より冷たい？（アルミ・ガラス・アクリル・発泡材に20秒触れる：熱が速く逃げるほど冷たい — 参考図（Ho, Temperature 2018, Fig. 3 をもとに作図））</li><li>豆知識：人に「濡れ」の受容体はない： 濡れ＝冷たさ＋軽い圧。（Filingeri ら 2014）</li><li>冷温を感じるカギは変化。</li></ol>
<h2 id="s-ja-illusions">脳も温度にだまされる</h2><p>温度の錯覚は面白いだけではありません。デバイスを省エネに、速く、そして「ないもの」を感じさせるために使われています。</p>
<ol><li>脳も温度にだまされる。 — 錯覚は面白いだけでなく、装置を省エネで速くする。</li><li>サーマルグリル錯覚：温と冷を交互に並べると、なぜか熱い（Craig &amp; Bushnell 1994；痛い温度で試さないでください）</li><li>サーマルリファーラル：1本だけ温めても、3本とも温かい（Green 1977；少ない発熱部で済む（Wang ら 2024））</li><li>やってみよう：同じ硬貨2枚。冷やしたほうが 重く感じる。（温度–重さ錯覚：19世紀にウェーバーが発見（Kuhtz-Buschbeck ら 2020））</li><li>3つのお椀：温度の感覚は相対的</li><li>見える温度：火や氷を見るだけで、冷温の感じ方が変わる（炎や氷のVR世界と手が、温冷感と皮膚温を変えた — 参考図（Kocur et al., CHI 2023 をもとに作図））</li><li>錯覚は、設計者の魔法。</li></ol>
<h2 id="s-ja-sensing">ガラス管から肌に貼る電子皮膚へ</h2><p>400年前はガラス管で空気の膨張を見ていました。今では紙より薄いセンサを肌に貼り、ロボットは触れたときの熱で材質を見分けます。</p>
<ol><li>ガラス管から電子皮膚へ。 — 機械はどう温度を測る？400年の物語。</li><li>歴史：温度が「感覚」から「数値」へ（Bigotti 2018；Fahrenheit 1724；Velmre 2007；Callendar 1887；Becker 1946；Kim 2011）</li><li>電子皮膚：皮膚のように、温度や圧力などを同時に感じる（伸び縮みする「皮膚のような」センサ網 — 参考図（Hua et al., Nature Communications 2018 をもとに作図））</li><li>ロボット：ロボットも触れて金属と木を見分ける（熱の逃げ方で材質を識別（Bhattacharjee ら 2015））</li><li>インタラクション：指が残す熱の跡がタッチ操作に（HeatWave（CHI 2011）；Thermal Touch（ISMAR 2014））</li><li>温度を測るのは、温度計だけじゃない。</li></ol>
<h2 id="s-ja-feedback">冷温を届ける：触れて、または離れて</h2><p>いちばん多いのは肌に当てる「ペルチェ素子」（電気を流すと片面が熱く、片面が冷たくなる板）。ほかに水・風・光・ミスト・超音波、さらには唐辛子成分や錯覚を使う方法も。速さ・距離・安全性にそれぞれ一長一短があります。</p>
<ol><li>冷温を届ける。 — 熱の運び方：触れて、風で、光で、蒸発で。</li><li>2つの道：肌に触れて、または離れて</li><li>伝導：1つ目：肌に触れて伝える（Ino ら 1993；Hayakawa ら 2015；Kim ら 2020）</li><li>ペルチェ：最も多い伝導素子：電気で片面が熱く、片面が冷たい（温度ディスプレイの古典的課題（Jones &amp; Ho 2008））</li><li>伝導 · 例：柔らかいグローブ：0.5秒で10 °C冷える（VRで物に触れたとき冷温を提示 — 参考図（Kim et al., Scientific Reports 2020 をもとに作図））</li><li>対流：2つ目：風で伝える（Ranasinghe ら 2017；Xu ら 2022；Akimoto ら 2025）</li><li>放射：3つ目：光で離れて伝える（Saga ら 2015；Iwai ら 2019；Xu ら 2023）</li><li>蒸発：4つ目：蒸発で熱を奪う（Nakajima ら 2021；Xu ら 2026）</li><li>蒸発 · 例：超音波でミストを手のひらの一点へ、蒸発で冷やす（触れずに点状の冷感 — 参考図（Nakajima et al., IEEE ToH 2021 をもとに作図））</li><li>化学：番外：化学物質で温度スイッチをだます（Lu ら 2021（UIST）；Hamazaki ら 2022）</li><li>課題：なぜ冷温は遅れるのか？（皮膚も装置も熱をためる：加熱は速く冷却は遅く、熱が残る（Jones &amp; Ho 2008））</li><li>高速化 1 · 知覚：冷温を小さく分けると、速く感じる（Zhang ら 2026（UIST, TherMosaic）；Sato ら 2013）</li><li>高速化 2 · 組み合わせ：光で温め、ミストで冷やす（Xu ら 2024（MoHeat）；Xu ら 2026（ChillFactor、MoHeat Evo）；Ichihashi ら 2024（UIST））</li><li>高速化 2 · 私たちの研究：冷風と短い光：冷たさが続き、冷えが残らない（同じ皮膚への非接触の冷感 — 参考図（Xu et al., IEEE ToH 2023 をもとに作図））</li><li>高速化 3 · ハード：冷と温を用意して、裏返して切替（Kang ら 2024（UIST, Flip-Pelt）；Ichihashi ら 2021（赤外線＋シャッター）；Hayakawa ら 2015（冷温水の切替））</li><li>比較：完璧な方法はない、合う方法がある</li><li>冷温はデザインできる。</li></ol>
<h2 id="s-ja-applications">温度はどこで使える？</h2><p>ゲームや音楽から病院、ロボットまで。多くはまだ研究段階で、臨床研究や長期研究があるものは一部です。証拠の強さも示しています。</p>
<ol><li>温度はどこで使える？ — エンタメ・感情・医療・ロボット……そして証拠の強さ。</li><li>10の分野：資料集の応用研究（数字は本資料集の収録数）</li><li>ロボット：柔らかく温かいロボットのハグは好まれる（ロボットに柔らかい服とヒーター — 参考図（Block &amp; Kuchenbecker, Int. J. Social Robotics 2019 をもとに作図））</li><li>証拠を見よう：「温かい飲み物を持つと親切になる」？ 大規模な追試では再現されなかった。（Williams &amp; Bargh 2008；Lynott ら 2014；Chabris ら 2019）</li><li>成熟度：多くはまだ研究段階、一部は臨床へ</li><li>温度の応用は、まだ始まったばかり。</li></ol>
<h2 id="s-ja-open">次はあなたの番</h2><p>分野で繰り返し出てくる難題であり、新しい研究のチャンスです。</p>
<h2 id="s-ja-trends">温度計から、いま熱い研究へ</h2><p>資料集の576本を年ごとに並べると、2000年代は年に約5本、2023年以降は年に約47本。研究の重心も「皮膚はどう感じるか」から「冷温を装置や応用にどう組み込むか」へ移っています。</p>
<ol><li>温度研究の300年。 — 資料集の 576 本を年ごとに並べて、何が研究されてきたかを見る。</li><li>年ごとの研究：この10年で研究が急増（2000年代は年に約5本、2023年以降は年に約47本（本資料集））</li><li>4つの時代：皮膚を知ることから、離れて冷温を届けることへ</li><li>重心の移動：研究の重心は知覚から装置と応用へ</li><li>キーワードのつながり：VR・ウェアラブル・クロスモーダルが中心に（タイトル・キーワード・要旨から26のテーマを抽出し、同じ論文に出たテーマ同士を線で結んだ）</li><li>注目の分野：非接触・錯覚・応用の研究が増えている</li><li>データの注意：集めた576本で、すべてではない。 新しい論文ほど見つけやすく、2026年はまだ途中。</li><li>温度研究は、いま熱い。</li></ol>
<h2 id="s-ja-books">もっと深く読みたい人へ</h2><p>誰でも読める一般書から研究者向けの教科書まで50冊を収録。書誌情報は AI の支援で図書目録と照合しました。</p>
<h2 id="s-ja-tools">温度を測る・届ける、実際に何を使う？</h2><p>研究でよく使う測温ツールと温度刺激装置、そして市販の冷温製品、計32種を用途別にまとめました。</p>
</section>

S.push({id:'why',nav:L3('为什么','なぜ温度','Why'),chip:L3('为什么是温度','なぜ温度なのか','Why temperature'),
title:L3('辣椒为什么“烫”，薄荷为什么“凉”？<br>这个问题拿了*诺贝尔奖*。','唐辛子はなぜ「熱く」、ミントはなぜ「涼しい」？<br>この問いが*ノーベル賞*に。','Why does chili feel *hot* and mint feel _cool_?<br>That question won a *Nobel Prize*.'),
lead:L3('2021 年诺贝尔生理学或医学奖颁给了 David Julius 和 Ardem Patapoutian，理由是“发现了温度和触觉的受体”。皮肤里有专门感受热和冷的分子开关，辣椒素和薄荷醇正好能把它们打开。','2021年のノーベル生理学・医学賞は、「温度と触覚の受容体の発見」でデビッド・ジュリアスとアーデム・パタプティアンに贈られました。皮膚には熱さと冷たさを感じる分子のスイッチがあり、カプサイシンやメントールはそれを直接オンにします。','The 2021 Nobel Prize in Physiology or Medicine went to David Julius and Ardem Patapoutian “for their discoveries of receptors for temperature and touch”. Our skin has molecular switches for heat and cold, and chili (capsaicin) and mint (menthol) flip them directly.'),
body:{zh:`<div class="rec"><div class="h"><b>TRPV1 · 热 / 辣椒</b><p>大约 43 °C 以上开始响应，辣椒素也能打开它。{{caterina1997trpv1}}</p></div><div class="c"><b>TRPM8 · 冷 / 薄荷</b><p>感受凉意，薄荷醇也能打开它。{{mckemy2002trpm8}} {{peier2002trpm8}}</p></div></div>
<h3 class="sub">温度为什么重要？</h3>
<div class="grid">
<div class="card heat"><h3>它告诉身体：热量在进还是在出</h3><p>烫伤和冻伤的警报都来自温度感觉。人能察觉非常小的温度变化，但前提是变化不能太慢。{{filingeri2016neurophysiology}}</p></div>
<div class="card"><h3>它和心情连在一起</h3><p>我们说“热情”“冷淡”。不过，“握一杯热饮会让人更友善”的著名实验，后来的大规模重复并没有得到同样结果。科学要看证据。{{williams2008warmth}} {{lynott2014replication}} {{chabris2019noevidence}}</p></div>
</div>
<h3 class="sub">如果电脑能给出冷和热，会怎样？</h3>
<div class="grid">
<div class="card"><h3>VR 里的阳光和风</h3><p>头戴设备吹出热风、凉风，让虚拟世界更真实。{{ranasinghe2017ambiotherm}} {{peiris2017thermovr}}</p></div>
<div class="card"><h3>会变暖变凉的音乐</h3><p>耳机随音乐的高潮变暖、随安静段落变凉。{{watanabe2026thermotune}} {{xu2024moheat}}</p></div>
<div class="card"><h3>让假手重新感到冷热</h3><p>给截肢者的残肢加热或降温，他们感觉像是“消失的手”在碰到冷热。{{iberite2023restoration}}</p></div>
</div>
<p class="note">更多应用，见第 5 章。</p>
<p class="note">这本手册按四个问题展开：我们怎样感觉冷热（感知、错觉）？机器怎样测量温度（传感）？怎样把冷热“送”给人（反馈）？可以用在哪里（应用）？</p>`,
ja:`<div class="rec"><div class="h"><b>TRPV1 · 熱 / 唐辛子</b><p>およそ43 °C以上で反応し、カプサイシンでもオンになります。{{caterina1997trpv1}}</p></div><div class="c"><b>TRPM8 · 冷 / ミント</b><p>涼しさを感じ、メントールでもオンになります。{{mckemy2002trpm8}} {{peier2002trpm8}}</p></div></div>
<h3 class="sub">温度はなぜ大切？</h3>
<div class="grid">
<div class="card heat"><h3>熱が入るか出るかを教えてくれる</h3><p>やけどや凍傷の警報は温度の感覚から来ます。人はとても小さな温度変化に気づけますが、変化がゆっくりすぎると気づきにくくなります。{{filingeri2016neurophysiology}}</p></div>
<div class="card"><h3>気持ちともつながる</h3><p>「温かい人」「冷たい態度」と言いますね。ただし「温かい飲み物を持つと人に親切になる」という有名な実験は、大規模な追試では再現されませんでした。証拠を見ることが大切です。{{williams2008warmth}} {{lynott2014replication}} {{chabris2019noevidence}}</p></div>
</div>
<h3 class="sub">コンピュータが冷たさ・温かさを出せたら？</h3>
<div class="grid">
<div class="card"><h3>VRの日差しと風</h3><p>ヘッドセットから温風や涼風が出て、仮想世界がもっとリアルに。{{ranasinghe2017ambiotherm}} {{peiris2017thermovr}}</p></div>
<div class="card"><h3>温かくなる音楽</h3><p>サビで温かく、静かな部分で涼しくなるヘッドホン。{{watanabe2026thermotune}} {{xu2024moheat}}</p></div>
<div class="card"><h3>義手でもう一度冷温を</h3><p>切断した腕の残りの部分を温めたり冷やしたりすると、失った手で触れているように感じられます。{{iberite2023restoration}}</p></div>
</div>
<p class="note">ほかの応用は第5章へ。</p>
<p class="note">このハンドブックは4つの問いで進みます。人はどう冷温を感じる？（知覚・錯覚）機械はどう測る？（センシング）どう人に届ける？（フィードバック）どこで使える？（応用）</p>`,
en:`<div class="rec"><div class="h"><b>TRPV1 · heat / chili</b><p>Responds above about 43 °C, and capsaicin from chili also switches it on. {{caterina1997trpv1}}</p></div><div class="c"><b>TRPM8 · cold / mint</b><p>Senses coolness, and menthol from mint also switches it on. {{mckemy2002trpm8}} {{peier2002trpm8}}</p></div></div>
<h3 class="sub">Why does temperature matter?</h3>
<div class="grid">
<div class="card heat"><h3>It tells the body whether heat is coming in or going out</h3><p>Warnings of burns and frostbite come from temperature sense. We notice tiny changes, but only if they are not too slow. {{filingeri2016neurophysiology}}</p></div>
<div class="card"><h3>It is tied to feelings</h3><p>We say “warm-hearted” and “a cold welcome”. But the famous finding that holding a hot drink makes people friendlier did not hold up in large repeat studies. Evidence matters. {{williams2008warmth}} {{lynott2014replication}} {{chabris2019noevidence}}</p></div>
</div>
<h3 class="sub">What if computers could give us warm and cold?</h3>
<div class="grid">
<div class="card"><h3>Sun and wind in VR</h3><p>Headsets blow warm or cool air to make virtual worlds feel real. {{ranasinghe2017ambiotherm}} {{peiris2017thermovr}}</p></div>
<div class="card"><h3>Music that warms and cools</h3><p>Headphones that warm up at the chorus and cool down in quiet parts. {{watanabe2026thermotune}} {{xu2024moheat}}</p></div>
<div class="card"><h3>Feeling hot and cold again</h3><p>Warming or cooling the arm of amputees made them feel temperature in their missing hand. {{iberite2023restoration}}</p></div>
</div>
<p class="note">More uses in Chapter 5.</p>
<p class="note">The handbook follows four questions: how do we feel hot and cold (perception, illusions)? How do machines measure temperature (sensing)? How can we send warmth and coolness to people (feedback)? Where can it be used (applications)?</p>`}});

S.push({id:'perception',cat:'perception',part:'feel',nav:L3('生理与感知','生理・知覚','Physiology'),chip:L3('生理与感知','生理・知覚','Physiology & perception'),
title:L3('皮肤更在意温度的*变化*','皮膚は温度の*変化*に敏感','Skin cares about *changes* in temperature'),
lead:L3('皮肤里分别有感“冷”和感“暖”的神经末梢。它们对温度的变化最敏感：变得太慢，就感觉不到；泡得太久，就习惯了。','皮膚には「冷たい」と「温かい」を感じる神経の先端が別々にあります。温度の変化にいちばん敏感で、変化がゆっくりだと気づかず、長く続くと慣れてしまいます。','Skin has separate nerve endings for cool and warm. They react most to change: too slow and you miss it, too long and you get used to it.'),
body:{zh:`<div class="grid">
<div class="card"><h3>大约 15–42 °C 不会疼</h3><p>超过约 43 °C，热痛受体开始工作。{{filingeri2016neurophysiology}} {{caterina1997trpv1}}</p></div>
<div class="card cold"><h3>冷比热更容易察觉</h3><p>全身 300 多个点的测量显示，皮肤对凉的敏感度是暖的 1.3–1.6 倍。{{luo2020maps}}</p></div>
<div class="card"><h3>不同部位差很多</h3><p>脸最灵敏，脚最迟钝，相差约 100 倍；年龄越大越迟钝。{{stevens1998sensitivity}}</p></div>
<div class="card heat"><h3>太慢就感觉不到</h3><p>温度每秒变化小于约 0.1 °C 时，就很难发现。{{filingeri2016neurophysiology}} {{kenshalo1968warmandcoolthres05d9}}</p></div>
<div class="card"><h3>泡久了会习惯</h3><p>在 28–37.5 °C 之间，皮肤大约 25 分钟就会完全适应，不再觉得冷或热。{{kenshalo1966adaptation}}</p></div>
<div class="card"><h3>面积越大越明显，但说不准位置</h3><p>同样的温度，接触面积越大感觉越强；可人很难说清冷热到底在哪一点。{{hardy1937spatial}} {{stevens1971spatialsummation1cad}}</p></div>
<div class="card"><h3>金属凉、木头暖</h3><p>摸东西时，手上的热量流走得越快，就觉得越凉；这是我们分辨材质的线索。{{ho2008model}} {{bergmanntiest2009diffusivity}}</p></div>
</div>`,
ja:`<div class="grid">
<div class="card"><h3>約15〜42 °Cなら痛くない</h3><p>約43 °Cを超えると熱の痛みの受容体が働き始めます。{{filingeri2016neurophysiology}} {{caterina1997trpv1}}</p></div>
<div class="card cold"><h3>冷たさの方が気づきやすい</h3><p>全身300点以上の測定で、冷たさへの感度は温かさの1.3〜1.6倍でした。{{luo2020maps}}</p></div>
<div class="card"><h3>体の場所で大きく違う</h3><p>顔がいちばん敏感で足がいちばん鈍く、約100倍の差。年齢とともに鈍くなります。{{stevens1998sensitivity}}</p></div>
<div class="card heat"><h3>ゆっくりだと気づかない</h3><p>1秒あたり約0.1 °Cより遅い変化は気づきにくくなります。{{filingeri2016neurophysiology}} {{kenshalo1968warmandcoolthres05d9}}</p></div>
<div class="card"><h3>長く続くと慣れる</h3><p>28〜37.5 °Cの間なら、約25分で完全に慣れて冷温を感じなくなります。{{kenshalo1966adaptation}}</p></div>
<div class="card"><h3>広いほど強いが、場所はあいまい</h3><p>触れる面積が大きいほど強く感じますが、どこが冷たいのかは正確にわかりにくいのです。{{hardy1937spatial}} {{stevens1971spatialsummation1cad}}</p></div>
<div class="card"><h3>金属は冷たく、木は温かい</h3><p>手の熱が速く逃げるほど冷たく感じ、それが材質を見分ける手がかりになります。{{ho2008model}} {{bergmanntiest2009diffusivity}}</p></div>
</div>`,
en:`<div class="grid">
<div class="card"><h3>About 15–42 °C feels pain-free</h3><p>Above about 43 °C, heat-pain receptors start to fire. {{filingeri2016neurophysiology}} {{caterina1997trpv1}}</p></div>
<div class="card cold"><h3>Cold is easier to notice</h3><p>Measured at 300+ points on the body, skin was 1.3–1.6 times more sensitive to cooling than to warming. {{luo2020maps}}</p></div>
<div class="card"><h3>Body sites differ a lot</h3><p>The face is most sensitive, the feet least—about 100-fold—and sensitivity drops with age. {{stevens1998sensitivity}}</p></div>
<div class="card heat"><h3>Too slow goes unnoticed</h3><p>Changes slower than about 0.1 °C per second are hard to detect. {{filingeri2016neurophysiology}} {{kenshalo1968warmandcoolthres05d9}}</p></div>
<div class="card"><h3>You get used to it</h3><p>Between 28 and 37.5 °C, skin fully adapts in about 25 minutes and stops feeling warm or cool. {{kenshalo1966adaptation}}</p></div>
<div class="card"><h3>Bigger feels stronger, but blurry</h3><p>A larger touch area feels stronger, yet we are poor at telling exactly where the warmth is. {{hardy1937spatial}} {{stevens1971spatialsummation1cad}}</p></div>
<div class="card"><h3>Metal feels cold, wood feels warm</h3><p>The faster heat leaves your hand, the colder it feels—a clue we use to tell materials apart. {{ho2008model}} {{bergmanntiest2009diffusivity}}</p></div>
</div>`}});

lead:L3('温度错觉不只是好玩：设计者用它们让设备更省电、更快，甚至“无中生有”。','温度の錯覚は面白いだけではありません。デバイスを省エネに、速く、そして「ないもの」を感じさせるために使われています。','Thermal illusions are not just fun: designers use them to make devices faster, cheaper and even to create feelings out of nothing.'),
cards:[
 {h:L3('热栅错觉','サーマルグリル錯覚','Thermal grill illusion'),p:L3('温和凉的细条交错排在一起，会感到“烫”甚至刺痛，虽然每一条都不烫。','温かい棒と冷たい棒を交互に並べると、どれも熱くないのに「熱い・痛い」と感じます。','Interlaced warm and cool bars can feel burning hot, though no single bar is hot.'),c:['craig1994grill','saga2022grill','mizuno2024dynapain'],k:'h'},
 {h:L3('热转移','サーマルリファーラル','Thermal referral'),p:L3('只加热中间一根手指，三根手指都觉得暖；设备可以用更少的发热点。','真ん中の指だけを温めても、3本とも温かく感じます。少ない発熱部で済みます。','Warm only the middle finger and all three touching fingers feel warm—fewer heaters needed.'),c:['green1977referral','ho2011referral','wang2024masking'],k:'h'},
 {h:L3('冷的更“重”','冷たいと「重い」','Cold feels heavier'),p:L3('两个一样重的东西，凉的那个感觉更重（韦伯在 19 世纪就注意到了）。','同じ重さでも、冷たいほうが重く感じます（19世紀にウェーバーが気づきました）。','Of two equal weights, the colder one feels heavier—first noticed by Weber in the 1800s.'),c:['kuhtzbuschbeck2020coldandheavy9ae3'],k:'c',t:L3('自己试试：把一枚硬币放冰箱几分钟，和另一枚一样的硬币放在手心比较。','やってみよう：硬貨1枚を冷蔵庫で数分冷やし、同じ硬貨と手のひらで比べてみよう。','Try it: chill one coin in the fridge for a few minutes and compare it with an identical coin on your palm.')},
 {h:L3('三碗水','3つのお椀','Three bowls of water'),p:L3('先适应的温度，决定了你对下一碗水的感觉：温度是“相对”的。','直前に慣れた温度で、次の水の感じ方が変わります。温度感覚は「相対的」です。','What you adapted to decides how the next bowl feels: temperature sense is relative.'),c:['kenshalo1966adaptation'],k:'c',t:L3('自己试试：左手放温水、右手放凉水一分钟，再一起放进常温水。','やってみよう：左手をぬるま湯、右手を冷水に1分入れ、両手を常温の水へ。','Try it: left hand in warm water, right hand in cool water for a minute, then both into room-temperature water.')},
 {h:L3('看见颜色、听见声音','色と音','Colours and sounds'),p:L3('红色让人以为更暖，蓝色更凉；倒热水和倒冷水的声音，人也能听出来。','赤は温かく、青は冷たく見えます。お湯と冷水を注ぐ音も聞き分けられます。','Red looks warm and blue cool; people can even hear whether hot or cold water is being poured.'),c:['ho2014colourtemperatur7828','ho2014combiningcoloura99b0','velasco2013thesoundoftempercdb1'],k:''},
 {h:L3('橡胶手让真手变凉','ラバーハンドで本物の手が冷える','A rubber hand cools your real hand'),p:L3('当人觉得假手是“自己的手”时，真手的皮肤温度竟然下降了。','偽物の手を「自分の手」と感じると、本物の手の皮膚温度が下がりました。','When people felt a rubber hand was theirs, the skin of their real hand actually cooled.'),c:['moseley2008psychologicallyi2647'],k:'c'},
 {h:L3('不湿也觉得湿','濡れていないのに濡れている','Wet without water'),p:L3('人没有感受“湿”的器官：凉 + 轻轻的压，大脑就会猜成“湿”。VR 里可以用它模拟水。','人には「濡れ」の受容体がありません。冷たさ＋軽い圧で、脳は「濡れた」と判断します。VRで水の表現に使えます。','We have no wetness sensor: cool plus light pressure makes the brain guess “wet”—handy for water in VR.'),c:['filingeri2014wet','han2020mouill263b'],k:'c'},
 {h:L3('会移动的热','動く熱','Moving warmth'),p:L3('按顺序加热几个点，人会感觉热在皮肤上“流动”。','いくつかの点を順に温めると、熱が皮膚の上を「流れる」ように感じます。','Heating a few spots in sequence makes warmth seem to flow across the skin.'),c:['singhal2024flow'],k:'h'}
]});

S.push({id:'sensing',cat:'sensing',part:'make',nav:L3('传感','センシング','Sensing'),chip:L3('传感','センシング','Sensing'),
title:L3('从玻璃管到贴在皮肤上的*电子皮肤*','ガラス管から肌に貼る*電子皮膚*へ','From glass tubes to *electronic skin*'),
lead:L3('400 年前，人们用一根玻璃管看空气热胀冷缩；今天，比纸还薄的传感器可以贴在皮肤上，机器人也能靠“摸”出的热量分辨材料。','400年前はガラス管で空気の膨張を見ていました。今では紙より薄いセンサを肌に貼り、ロボットは触れたときの熱で材質を見分けます。','Four centuries ago people watched air expand in a glass tube. Today sensors thinner than paper sit on skin, and robots tell materials apart by the heat they feel.'),
timeline:[
 ['1610s',L3('桑托里奥用早期温度计测体温，测温从“感觉”走向“数字”。','サントリオが初期の温度計で体温を測り、温度が「数値」に。','Santorio measures body heat with early thermometers: temperature becomes a number.'),'bigotti2018theweightoftheai1cf8','c'],
 ['1724',L3('华伦海特报告用温度计做的结冰实验。','ファーレンハイトが温度計による凍結実験を報告。','Fahrenheit reports freezing experiments with his thermometers.'),'fahrenheit1724viiiexperimentao32c1','c'],
 ['1821',L3('塞贝克发现两种金属接点受热会产生电：热电偶的原理。','ゼーベックが異種金属の接点を温めると電気が生じることを発見（熱電対の原理）。','Seebeck finds that heating a junction of two metals makes electricity—the thermocouple principle.'),'velmre2007thomasjohannseebeb64','h'],
 ['1880',L3('兰利发明测热辐射的“测辐射热计”。','ラングレーが熱放射を測るボロメータを発明。','Langley invents the bolometer for measuring heat radiation.'),'langley1880thebolometerandr4026','h'],
 ['1887',L3('卡伦德提出精确的铂电阻温度计。','カレンダーが精密な白金抵抗温度計を提案。','Callendar develops the precise platinum resistance thermometer.'),'callendar1887vionthepractical6722','c'],
 ['1946',L3('热敏电阻：温度一变，电阻就大变，便宜又灵敏。','サーミスタ：温度で抵抗が大きく変わる、安くて敏感なセンサ。','Thermistors: cheap parts whose resistance changes strongly with temperature.'),'becker1946propertiesandusebc9f','c'],
 ['2011',L3('“表皮电子”：像临时纹身一样贴在皮肤上的电路。','「表皮エレクトロニクス」：タトゥーシールのように肌に貼る回路。','Epidermal electronics: circuits that stick to skin like a temporary tattoo.'),'kim2011epidermalelectro1f2a','h'],
 ['2013',L3('超薄传感器连续、精确地测量皮肤温度。','超薄型センサで皮膚温度を連続・高精度に計測。','Ultrathin sensors measure skin temperature precisely and continuously.'),'webb2013ultrathinconform1136','h']],
cards:[
 {h:L3('热像仪变成触控板','サーモカメラがタッチパネルに','Thermal cameras as touch input'),p:L3('手指碰过的地方会留下“热手印”，热像仪看得见，于是任何表面都能变成触控面。','指が触れた所には「熱の跡」が残り、サーモカメラで見えるので、どんな面もタッチ面になります。','Fingers leave warm marks that a thermal camera can see, turning any surface into a touch pad.'),c:['larson2011heatwave0710','kurz2014thermaltouchf646']},
 {h:L3('机器人“摸”出材料','ロボットが触って材質を知る','Robots feel materials'),p:L3('像人一样，机器人根据接触时热量流走的快慢，分辨金属、木头和塑料。','人と同じように、触れたときの熱の逃げ方で金属・木・プラスチックを見分けます。','Like us, robots tell metal, wood and plastic apart by how fast heat flows on contact.'),c:['bhattacharjee2015materialrecognit671a','monkman1993thermaltactilese3f73']},
 {h:L3('看不见的心跳与情绪','見えない心拍と感情','Hidden signals in the face'),p:L3('非常灵敏的热成像能看到脸上极小的温度变化，用来读取生理状态。','とても高感度な熱画像で、顔のごく小さな温度変化から生理状態を読み取ります。','Highly sensitive thermal imaging sees tiny facial temperature changes linked to the body’s state.'),c:['kotani2025synchrothermograb7db','ring2012infraredthermali1457']}
]});

S.push({id:'feedback',cat:'feedback',part:'make',nav:L3('反馈','フィードバック','Feedback'),chip:L3('反馈','フィードバック','Feedback'),
title:L3('把冷热送给人：*贴着*，或者_隔空_','冷温を届ける：*触れて*、または_離れて_','Sending warm and cool: *by touch* or _through the air_'),
lead:L3('最常见的是贴在皮肤上的“珀尔帖”小板（一通电就一面热一面冷）；也有用水、风、光、雾、超声，甚至辣椒素和错觉的方法。各有快慢、远近和安全上的取舍。','いちばん多いのは肌に当てる「ペルチェ素子」（電気を流すと片面が熱く、片面が冷たくなる板）。ほかに水・風・光・ミスト・超音波、さらには唐辛子成分や錯覚を使う方法も。速さ・距離・安全性にそれぞれ一長一短があります。','The most common tool is a Peltier element on the skin—a small plate that gets hot on one side and cold on the other when powered. Others use water, air, light, mist, ultrasound, even chili and illusions. Each trades off speed, distance and safety.'),
modes:{h:L3('先懂原理：热量有四种走法，外加一条捷径','まず原理：熱の伝わり方は4つ、そして近道が1つ','First, the physics: four ways heat travels, plus one shortcut'),
 p:L3('不管是什么设备，热量进出皮肤只有四条路：传导、对流、辐射和蒸发。知道是哪一条，就能猜到它快不快、要不要贴着皮肤、能不能降温。另外还有一条捷径：化学物质不传热，直接让皮肤“觉得”冷或热。','どんな装置でも、熱が皮膚に出入りする道は伝導・対流・放射・蒸発の4つだけです。どの道かが分かれば、速さ・接触の要否・冷やせるかが見えてきます。さらに近道が1つ。化学物質は熱を運ばず、皮膚に冷温を「感じさせ」ます。','Whatever the device, heat reaches or leaves the skin in only four ways: conduction, convection, radiation and evaporation. Knowing which one tells you how fast it is, whether it must touch, and whether it can cool. There is also one shortcut: chemicals move no heat at all, yet make skin feel warm or cool.'),
 list:[
 {k:'cond',h:L3('传导：贴着传','伝導：触れて伝える','Conduction: by touch'),p:L3('两个东西贴在一起，热量从热的一方流向冷的一方。金属摸起来凉，就是因为它把手上的热量很快导走。珀尔帖片、水管、热电手套都靠它。','触れ合うと、熱は温かい方から冷たい方へ流れます。金属が冷たく感じるのは、手の熱を速く奪うから。ペルチェ素子・水流・熱電グローブはこれを使います。','When two things touch, heat flows from the warmer to the cooler one. Metal feels cold because it pulls heat from your hand quickly. Peltier plates, water tubes and thermal gloves all work this way.'),m:L3('珀尔帖 · 电阻加热 · 水流','ペルチェ・電熱線・水流','Peltier plates · heating wires · water tubes'),c:['ino1993display','hayakawa2015waterflow','kim2020glove','ho2018material','jones2008warm','kuroda2024representationof0b7d']},
 {k:'conv',h:L3('对流：让风带着走','対流：風が運ぶ','Convection: carried by air'),p:L3('流动的空气（或水）把热量带过来或带走。吹风扇觉得凉就是对流。不用接触皮肤，但风也会被同时感觉到。','流れる空気（や水）が熱を運びます。扇風機で涼しいのが対流。肌に触れずに済みますが、風そのものも感じます。','Moving air (or water) carries heat to or away from the skin—that is why a fan feels cool. No contact is needed, but you feel the breeze too.'),m:L3('热风 / 冷风 · 涡流 · 环绕手臂的气流','温風・冷風・渦輪・腕を包む気流','Warm or cold air · vortex rings · airflow around the arm'),c:['ranasinghe2017ambiotherm','xu2022vortex','akimoto2025coanda']},
 {k:'rad',h:L3('辐射：用光隔空送','放射：光で離れて届ける','Radiation: sent by light'),p:L3('光和红外线不需要任何介质，就能把能量送到皮肤上，就像晒太阳会觉得暖。适合隔空加热，但很难用它降温。','光や赤外線は何も介さずに皮膚へエネルギーを届けます。日なたが暖かいのと同じ。離れて温めるのは得意ですが、冷やすのは苦手です。','Light and infrared deliver energy across empty space—like feeling warm in the sun. Great for heating from afar, but hard to use for cooling.'),m:L3('红外灯 · LED · 激光','赤外線ランプ・LED・レーザー','Infrared lamps · LEDs · lasers'),c:['saga2015heathapt','iwai2019noncontactthermod1f3','xu2023integration','xu2024moheat']},
 {k:'evap',h:L3('蒸发：变成气体时带走热','蒸発：気体になるとき熱を奪う','Evaporation: vapour takes heat away'),p:L3('液体在皮肤上变成气体时，会带走很多热量，所以出汗后吹风特别凉。把细雾或酒精送到皮肤上，就能隔空快速降温。','液体が皮膚の上で気体になると多くの熱を奪います。汗をかいて風に当たると涼しいのはこのため。ミストやアルコールを届ければ、離れたまま素早く冷やせます。','A liquid turning into vapour on the skin takes a lot of heat with it—why sweat in a breeze feels so cool. Delivering fine mist or alcohol cools quickly without contact.'),m:L3('细雾 · 用超声波送雾 · 酒精','ミスト・超音波で運ぶミスト・アルコール','Fine mist · ultrasound-guided mist · alcohol'),c:['nakajima2021mist','xu2026chillfactor']},
 {k:'chem',h:L3('捷径：化学物质“骗”开关','近道：化学物質でスイッチをだます','The shortcut: chemicals trick the sensors'),p:L3('辣椒素和薄荷醇不改变皮肤温度，而是直接打开皮肤里的“热”和“冷”开关，所以严格说不是传热，但同样能带来冷热感。','カプサイシンやメントールは皮膚温度を変えず、皮膚の「熱」「冷」スイッチを直接オンにします。厳密には伝熱ではありませんが、冷温感を生みます。','Capsaicin and menthol leave skin temperature unchanged; they switch the heat and cold sensors on directly. Strictly not heat transfer—but you still feel warm or cool.'),m:L3('辣椒素（暖） · 薄荷醇（凉）','カプサイシン（温）・メントール（冷）','Capsaicin (warm) · menthol (cool)'),c:['lu2021chemical','hamazaki2022chemicalinducedtd402','hensel1951menthol']}
 ]},

fast:{h:L3('难题：怎样让冷热更快？','課題：冷温をどう速くするか','The hard part: making warm and cool faster'),
 p:L3('皮肤和设备都会“存”热：加热快、降温慢，冷热来回切换时还会留下余热。研究者主要有三种提速办法。','皮膚も装置も熱を「ためる」ため、温めるのは速く冷やすのは遅く、切り替えると熱が残ります。速くする方法は主に3つあります。','Skin and devices both store heat: warming is quick, cooling is slow, and switching leaves heat behind. There are three main ways to speed things up.'),
 list:[
 {h:L3('借助感知：让人“觉得”更快','知覚を使う：速く「感じさせる」','Use perception: make it feel faster'),p:L3('把冷和热分成小块交错排列，或在空间和时间上叠加刺激，皮肤会把它们“合并”起来，感觉温度变化比设备实际更快。TherMosaic（UIST 2026）就用这种方法让指尖的冷热转变感觉更快。','冷と温を小さく分けて並べたり、空間と時間で刺激を重ねたりすると、皮膚はそれらを「まとめて」感じ、実際より速く変わったように感じます。TherMosaic（UIST 2026）はこの方法で指先の切り替えを速く感じさせました。','Split hot and cold into small interleaved patches, or layer stimuli in space and time, and skin blends them so the change feels faster than the hardware really is. TherMosaic (UIST 2026) uses this to make fingertip transitions feel quicker.'),c:['zhang2026thermosaica3db','sato2013rapid'],k:'c'},
 {h:L3('组合传热方式：各取所长','伝熱方式を組み合わせる','Combine heat routes'),p:L3('一种方式负责持续，另一种负责瞬间变化：例如冷风一直吹、LED 光短暂加热；或者用光加热、用雾降温；或者用可见光照射水层。冷和热都能快，也不容易留下余热。','一方が持続、もう一方が瞬間的な変化を担当します。冷風を当て続けてLED光で短く温める、光で温めてミストで冷やす、可視光で水の層を温めるなど。冷温どちらも速く、熱が残りにくくなります。','One route holds the baseline while another makes quick changes: steady cold air with brief LED warming, light to heat and mist to cool, or visible light heating a thin layer of water. Both warm and cool get faster, with little heat left behind.'),c:['xu2023integration','xu2024moheat','xu2026chillfactor','xu2026moheatevo','ichihashi2024hydropticalthermef4c'],k:'h'},
 {h:L3('改造硬件：让设备本身更快','ハードを工夫する','Smarter hardware'),p:L3('提前把冷和热准备好，再快速切换：用快门挡住或放开红外光，用电机翻转已经预热或预冷的珀尔帖片，或者在冷水和热水之间切换。','冷と温をあらかじめ用意して素早く切り替えます。シャッターで赤外光を遮る・通す、モーターで予熱・予冷したペルチェ素子を裏返す、冷水と温水を切り替える、など。','Prepare hot and cold in advance and switch fast: a shutter that blocks or releases infrared light, a motor that flips pre-heated or pre-cooled Peltier plates, or switching between cold and hot water.'),c:['ichihashi2021highspeednoncont7789','kang2024flippeltc86d','hayakawa2015waterflow'],k:''}]},
table:{head:L3(['方式','碰皮肤？','加热','降温','典型用途'],['方式','触れる？','加熱','冷却','主な用途'],['Method','Touch?','Heat','Cool','Typical use']),
rows:[['peltier','✓','✓','✓',L3('手套、手柄、VR 头显','グローブ・コントローラ・HMD','Gloves, controllers, headsets')],['resistive_heating','✓','✓','—',L3('服装、座椅','衣服・座席','Clothing, seats')],['fluid','✓','✓','✓',L3('大面积、医疗','広い面・医療','Large areas, medicine')],['air_convection','—','✓','✓',L3('VR 环境、脸部','VR環境・顔','VR rooms, the face')],['radiation','—','✓','—',L3('隔空加热','離れて加熱','Contact-free warming')],['evaporative','—','—','✓',L3('隔空降温','離れて冷却','Contact-free cooling')],['chemical','✓','✓','✓',L3('可穿戴、低功耗','ウェアラブル・省電力','Wearables, low power')]]},
extra:{zh:`<p class="note">也可以借助错觉，用更少的发热点做出更多感觉（见第 2 章）。{{wang2024masking}} {{saga2022grill}}</p><p class="note">热显示的经典难题：要够快、不残留余热、要安全、要省电、还要能做得细。{{jones2008warm}} 最早用温度表现“材质手感”的显示器之一出现在 1993 年。{{ino1993display}}</p>`,ja:`<p class="note">錯覚を使えば、少ない発熱部でより多くの感覚を作れます（第2章）。{{wang2024masking}} {{saga2022grill}}</p><p class="note">温度ディスプレイの古典的な課題は、速さ・残熱のなさ・安全・省電力・細かさの両立です。{{jones2008warm}} 温度で「材質感」を表す最初期のディスプレイは1993年に登場しました。{{ino1993display}}</p>`,en:`<p class="note">Illusions also help: fewer heaters can create more feeling (see Chapter 2). {{wang2024masking}} {{saga2022grill}}</p><p class="note">The classic challenges of thermal displays: be fast, leave no leftover heat, stay safe, save power and still be detailed. {{jones2008warm}} One of the first displays to render the “feel” of materials by temperature appeared in 1993. {{ino1993display}}</p>`}});

  const c=e.target.closest('.cite');if(c){qi.value='';qi.dataset.id=c.dataset.id;[fc,fs,fm,fg,fy].forEach(s=>s.value='');search(true);document.getElementById('library').scrollIntoView();return}
  const s=e.target.closest('.seeall');if(s){qi.value='';qi.dataset.id='';[fc,fs,fm,fg,fy].forEach(x=>x.value='');if(s.dataset.f==='c'){fc.value=s.dataset.v;buildFilters()}else{fc.value=LIB.find(p=>p.s===s.dataset.v)?.c||'';buildFilters();fs.value=s.dataset.v}search(true);return}
  const ch=e.target.closest('.chap-head[data-id]');if(ch){const o=!OPEN.has(ch.dataset.id);setChap(ch.dataset.id,o);if(o){CUR=ch.dataset.id;syncURL()}return}
  const go=e.target.closest('[data-go]');if(go){e.preventDefault();setChap(go.dataset.go,true);CUR=go.dataset.go;syncURL();document.body.classList.remove('side-open');document.getElementById(go.dataset.go).scrollIntoView({behavior:'smooth'});return}
  const al=e.target.closest('[data-all]');if(al){S.forEach(x=>setChap(x.id,al.dataset.all==='1'));return}
  if(e.target.closest('#tocbtn')){document.body.classList.toggle('side-open');return}
  if(e.target.closest('#vtog')){VOPEN=!VOPEN;venBox();return}
  if(e.target.closest('#ytog')){YOPEN=!YOPEN;try{localStorage.setItem('thci-yrs',YOPEN?'1':'0')}catch(x){}YJUST=YOPEN;search();return}
  const tg=e.target.closest('[data-cat]');if(tg){qi.dataset.id='';fc.value=fc.value===tg.dataset.cat?'':tg.dataset.cat;buildFilters();search(true);if(!tg.closest('#cats'))document.getElementById('cats').scrollIntoView({behavior:'smooth',block:'center'});return}
  const bb=e.target.closest('[data-bib]');if(bb){copy(bib(BY[bb.dataset.bib]),bb);return}
  const ex=e.target.closest('[data-exp]');if(ex){ex.dataset.exp==='bib'?dl('thermal-hci.bib',LASTR.map(bib).join('\n\n')+'\n','application/x-bibtex'):dl('thermal-hci.csv','\ufeff'+csv(LASTR),'text/csv');return}
  const oq=e.target.closest('[data-oq]');if(oq){e.preventDefault();TOPIC='oq:'+oq.dataset.oq;qi.dataset.id='';search(true);document.getElementById('library').scrollIntoView({behavior:'smooth'});return}
  const tgb=e.target.closest('[data-tg]');if(tgb){TOOLG=TOOLG===tgb.dataset.tg?'':tgb.dataset.tg;document.getElementById('toolsbox').innerHTML=toolsHTML();return}
  const tp=e.target.closest('[data-topic]');if(tp){e.preventDefault();TOPIC=tp.dataset.topic;qi.dataset.id='';search(true);if(TOPIC)document.getElementById('library').scrollIntoView({behavior:'smooth'});return}
  const nn=e.target.closest('.nn');if(nn){NETSEL=NETSEL===nn.dataset.k?null:nn.dataset.k;drawNet();return}
  const ns=e.target.closest('[data-ns]');if(ns){NETS=+ns.dataset.ns;drawNet();return}
  const yb=e.target.closest('.yb');if(yb){qi.dataset.id='';fy.value=fy.value===yb.dataset.y?'':yb.dataset.y;search(true);return}
  const v=e.target.closest('.barrow');if(v){qi.dataset.id='';fg.value=fg.value===v.dataset.g?'':v.dataset.g;search(true)}
});
document.addEventListener('mouseover',e=>{const yb=e.target.closest&&e.target.closest('.yb');const r=document.getElementById('yread');if(r)r.textContent=yb?yb.title:''});
document.addEventListener('keydown',e=>{const ch=e.target.closest&&e.target.closest('.chap-head[data-id]');if(ch&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setChap(ch.dataset.id,!OPEN.has(ch.dataset.id))}});
if(QS.get('q'))document.getElementById('q').value=QS.get('q');
render();
if(CUR&&document.getElementById(CUR))setTimeout(()=>document.getElementById(CUR).scrollIntoView(),60);
// highlight the chapter whose header has reached the top of the screen (none while on the cover)
function mark(){let cur='';document.querySelectorAll('section.chap').forEach(x=>{if(x.getBoundingClientRect().top<160)cur=x.id});document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on',a.dataset.go===cur))}
function prog(){const h=document.documentElement;document.getElementById('prog').style.transform=`scaleX(${Math.min(1,h.scrollTop/Math.max(1,h.scrollHeight-innerHeight))})`}
addEventListener('scroll',()=>{mark();prog()},{passive:true});document.addEventListener('click',()=>setTimeout(mark,50));mark();
</script>
</body>
</html>
