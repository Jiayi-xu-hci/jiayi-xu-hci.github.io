<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thermal HCI · applications (en)</title>
<style>
:root{--bg:#f5f6f3;--ink:#17201e;--muted:#5b6865;--teal:#1d6f66;--accent:#f26b1d;--accent-soft:#fdeee3;--card:#fff;--line:#dde2de;}
html,body{margin:0;height:100%;background:#101615;}
body{overflow:hidden;font-family:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:var(--bg);overflow:hidden;transform-origin:center;}
.scene{position:absolute;inset:0;opacity:0;transform-origin:center;}
.chip{position:absolute;left:100px;top:66px;background:var(--teal);color:#fff;font-size:22px;font-weight:700;letter-spacing:.08em;padding:8px 16px;border-radius:6px;text-transform:uppercase;}
.h1{position:absolute;left:100px;top:118px;right:100px;font-size:56px;font-weight:750;letter-spacing:-.015em;line-height:1.12;}
.acc{color:var(--accent);}
.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.05);overflow:hidden;}
.imgbox{position:absolute;overflow:hidden;border-radius:16px;}
.imgbox.framed{background:#fff;border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.05);}
.imgbox img{position:absolute;inset:0;width:100%;height:100%;transform-origin:center;}
.caption{position:absolute;left:100px;right:100px;bottom:56px;height:84px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:28px;padding-right:32px;box-shadow:0 4px 18px rgba(0,0,0,.04);}
.caption b{align-self:stretch;display:flex;align-items:center;background:var(--teal);color:#fff;font-size:20px;letter-spacing:.1em;padding:0 26px;border-radius:12px 0 0 12px;}
.caption span{font-size:31px;line-height:1.25;}
.callout{position:absolute;transform:translate(-50%,-50%);}
.callout i{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 6px rgba(242,107,29,.25);}
.callout span{position:absolute;white-space:nowrap;background:var(--ink);color:#fff;font-size:26px;font-weight:650;padding:8px 16px;border-radius:999px;}
.step h4{margin:0;font-size:32px;font-weight:750;}
.step p{margin:8px 0 0;font-size:25px;line-height:1.35;color:var(--muted);}
.step .n{position:absolute;left:22px;top:18px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:2;}
.arrow{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:3;}
.stat .v{font-size:150px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--accent);}
.stat .v small{font-size:56px;font-weight:700;margin-left:6px;letter-spacing:0;}
.stat .l{font-size:30px;line-height:1.3;margin-top:18px;font-weight:600;}
.stat .s{font-size:23px;line-height:1.3;margin-top:8px;color:var(--muted);}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 18px;font-size:24px;font-weight:700;}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 70% 50%,var(--accent) 0,rgba(255,255,255,0) 60%);opacity:0;mix-blend-mode:multiply;}
#controls{position:fixed;left:0;right:0;bottom:0;height:56px;background:#101615;color:#e8eeec;display:flex;align-items:center;gap:14px;padding:0 18px;font:14px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;}
#controls button{background:#24302e;color:#e8eeec;border:0;border-radius:6px;height:34px;min-width:44px;font-size:15px;cursor:pointer;}
#controls input{flex:1;accent-color:var(--accent);}
#start{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center;background:rgba(16,22,21,.55);cursor:pointer;}
#start span{background:var(--accent);color:#fff;font:600 22px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;padding:20px 34px;border-radius:999px;}
body.capture #controls,body.capture #start{display:none;}
</style>
</head>

/* ---------- scene builders: each returns {root, bars, items:[{el, beat}], update(t, b)} ---------- */
const B = {};
function header(root, sc, items) {
  if (sc.chip) items.push({ el: div('chip', '', rich(sc.chip), root), beat: 0 });
  if (sc.head) items.push({ el: div('h1', '', rich(sc.head), root), beat: 0 });
}
function kenBurns(pics) {
  return (t, b, dur) => pics.forEach((p, i) => {
    const z = 1 + .05 * ramp(t, 0, dur) + .01 * kick(b);
    p.img.style.transform = `scale(${z}) translate(${(i % 2 ? -1 : 1) * 6 * ramp(t, 0, dur)}px,0)`;
  });
}

B.title = (sc, root, items) => {
  const col = div('', 'position:absolute;left:100px;top:0;bottom:0;width:' + (sc.image ? 900 : 1500) + 'px;display:flex;flex-direction:column;justify-content:center;gap:0', null, root);
  items.push({ el: div('', 'font-size:24px;font-weight:700;color:var(--teal);letter-spacing:.06em;text-transform:uppercase;margin-bottom:26px', rich(sc.kicker), col), beat: 0 });
  (sc.title || '').split('|').forEach((line, i) =>
    items.push({ el: div('', `font-size:${sc.titleSize || 100}px;font-weight:800;letter-spacing:-.03em;line-height:1.04`, rich(line), col), beat: 1 + i }));
  if (sc.sub) items.push({ el: div('', 'font-size:34px;line-height:1.35;color:var(--muted);margin-top:34px;max-width:860px', rich(sc.sub), col), beat: 4 });
  if (sc.authors) items.push({ el: div('', 'font-size:26px;line-height:1.5;margin-top:34px', rich(sc.authors), col), beat: 6 });
  const pics = [];
  if (sc.image) {
    const p = picture(root, sc.image, 1060, 140, 760, 800, { fit: sc.fit, frame: sc.frame, auto: sc.fit !== 'cover' });
    items.push({ el: p.box, beat: 0, bump: true }); pics.push(p);
  }
  return kenBurns(pics);
};

B.statement = (sc, root, items) => {
  header(root, sc, items);
  const w = sc.image || sc.deco ? 960 : 1600;
  const col = div('', `position:absolute;left:100px;top:${sc.head ? 230 : 120}px;bottom:${sc.caption ? 160 : 80}px;width:${w}px;display:flex;flex-direction:column;justify-content:center;gap:28px`, null, root);
  (sc.lines || []).forEach((line, i) =>
    items.push({ el: div('', `font-size:${sc.size || 68}px;font-weight:750;letter-spacing:-.02em;line-height:1.12`, rich(line), col), beat: (sc.head ? 1 : 0) + i * (sc.every || 2) }));
  const after = (sc.head ? 1 : 0) + (sc.lines || []).length * (sc.every || 2);
  if (sc.note) items.push({ el: div('', 'font-size:30px;line-height:1.4;color:var(--muted)', rich(sc.note), col), beat: after });
  if (sc.tags) {
    // application / impact pills, one per beat
    const row = div('', 'display:flex;flex-wrap:wrap;gap:14px;margin-top:8px', null, col);
    sc.tags.forEach((tg, i) => items.push({ el: div('tag', 'font-size:28px;padding:10px 22px', rich(tg), row), beat: after + (sc.note ? 1 : 0) + i }));
  }
  const pics = [];
  if (sc.image) {
    const p = picture(root, sc.image, 1120, sc.head ? 240 : 140, 700, sc.caption ? 620 : 700, { fit: sc.fit, frame: sc.frame, auto: sc.fit !== 'cover' });
    items.push({ el: p.box, beat: sc.imageBeat ?? 1, bump: true }); pics.push(p);
  }
  let deco = null;
  if (sc.deco && !sc.image) {
    // a large glyph on the right (e.g. "?" for the research question), breathing on the beat
    deco = div('', 'position:absolute;right:120px;top:50%;width:640px;height:640px;margin-top:-340px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent-soft)', `<span style="font-size:${sc.decoSize || 440}px;font-weight:800;color:var(--accent);line-height:1">${sc.deco}</span>`, root);
    items.push({ el: deco, beat: 0 });
  }
  if (sc.caption) items.push({ el: div('caption', '', `<b>${sc.captionTag || 'TAKEAWAY'}</b><span>${rich(sc.caption)}</span>`, root), beat: sc.captionBeat ?? 8 });
  const kb = kenBurns(pics);
  return (t, b, dur) => {
    kb(t, b, dur);
    if (deco) deco.firstChild.style.transform = `rotate(${-6 + 8 * ramp(t, 0, dur)}deg) scale(${1 + .05 * kick(b)})`;
  };
};

B.figure = (sc, root, items) => {
  header(root, sc, items);
  const top = sc.head ? 230 : 120, h = (sc.caption ? 900 : 1010) - top;
  const p = picture(root, sc.image, 100, top, 1720, h, { fit: sc.fit, frame: sc.frame });
  items.push({ el: p.box, beat: 1, bump: true });
  const calls = (sc.callouts || []).map((c, i) => {
    const el = div('callout', '', `<i></i><span>${rich(c.text)}</span>`, p.box);
    const lab = el.querySelector('span');
    const side = c.side || 'right';
    lab.style.cssText = { right: 'left:24px;top:-24px', left: 'right:24px;top:-24px', top: 'left:50%;bottom:24px;transform:translateX(-50%)', bottom: 'left:50%;top:24px;transform:translateX(-50%)' }[side];
    items.push({ el, beat: c.beat ?? 3 + i * 2 });
    return { el, c };
  });
  if (sc.caption) items.push({ el: div('caption', '', `<b>${sc.captionTag || 'TAKEAWAY'}</b><span>${rich(sc.caption)}</span>`, root), beat: sc.captionBeat ?? 3 + calls.length * 2 });
  const kb = kenBurns(sc.still ? [] : [p]);
  return (t, b, dur) => {
    kb(t, b, dur);
    const r = p.rect();
    calls.forEach(({ el, c }) => { el.style.left = r.x + r.w * c.x / 100 + 'px'; el.style.top = r.y + r.h * c.y / 100 + 'px'; });
  };
};

B.compare = (sc, root, items) => {
  header(root, sc, items);
  const top = sc.head ? 240 : 140, h = (sc.caption ? 900 : 1000) - top;
  const pics = (sc.panels || []).map((pn, i) => {
    const x = 100 + i * 880;
    const card = div('card', `left:${x}px;top:${top}px;width:840px;height:${h}px`, null, root);
    div('', 'position:absolute;left:28px;top:20px;font-size:30px;font-weight:750', rich(pn.label), card);
    if (pn.text) div('', 'position:absolute;left:28px;top:62px;right:28px;font-size:24px;color:var(--muted);line-height:1.3', rich(pn.text), card);
    const p = picture(card, pn.image, 20, pn.text ? 112 : 76, 800, h - (pn.text ? 132 : 96), { fit: pn.fit, frame: false });
    items.push({ el: card, beat: 1 + i * 2, bump: true });
    return p;
  });
  if (sc.vs !== false && pics.length === 2) items.push({ el: div('arrow', `left:${938}px;top:${top + h / 2 - 22}px;width:64px;height:64px;font-size:22px;font-weight:800;background:var(--accent)`, sc.vs || 'vs', root), beat: 2 });
  if (sc.caption) items.push({ el: div('caption', '', `<b>${sc.captionTag || 'TAKEAWAY'}</b><span>${rich(sc.caption)}</span>`, root), beat: sc.captionBeat ?? 6 });
  return kenBurns(pics);
};

B.steps = (sc, root, items) => {
  header(root, sc, items);
  const n = sc.steps.length, gap = 60, w = (1720 - gap * (n - 1)) / n, top = sc.head ? 250 : 150, h = (sc.caption ? 890 : 980) - top;
  const pics = [];
  sc.steps.forEach((st, i) => {
    const x = 100 + i * (w + gap);
    const card = div('card step', `left:${x}px;top:${top}px;width:${w}px;height:${h}px`, null, root);
    div('n', '', i + 1, card);
    const ih = st.image ? Math.round(h * .58) : 0;
    if (st.image) pics.push(picture(card, st.image, 0, 0, w, ih, { fit: st.fit || 'contain', frame: false }));
    div('', `position:absolute;left:28px;right:28px;top:${ih + 26}px`, `<h4>${rich(st.title)}</h4>${st.text ? `<p>${rich(st.text)}</p>` : ''}`, card);
    items.push({ el: card, beat: 1 + i * (sc.every || 2), bump: true });
    if (i < n - 1) items.push({ el: div('arrow', `left:${x + w + gap / 2 - 22}px;top:${top + h / 2 - 22}px`, '→', root), beat: 2 + i * (sc.every || 2) });
  });
  if (sc.caption) items.push({ el: div('caption', '', `<b>${sc.captionTag || 'TAKEAWAY'}</b><span>${rich(sc.caption)}</span>`, root), beat: sc.captionBeat ?? 1 + n * (sc.every || 2) });
  return kenBurns(pics);
};

B.stats = (sc, root, items) => {
  header(root, sc, items);
  const n = sc.stats.length, gap = 60, hasImg = !!sc.image;
  const areaW = hasImg ? 1000 : 1720, w = (areaW - gap * (n - 1)) / n;
  const top = sc.head ? 300 : 220;
  const counters = sc.stats.map((s, i) => {
    const el = div('stat', `position:absolute;left:${100 + i * (w + gap)}px;top:${top}px;width:${w}px`,
      `<div class="v"><span></span><small>${rich(s.unit || '')}</small></div><div class="l">${rich(s.label)}</div>${s.sub ? `<div class="s">${rich(s.sub)}</div>` : ''}`, root);
    const beat = s.beat ?? 2 + i * 2;
    items.push({ el, beat: beat - 1 });
    return { span: el.querySelector('.v span'), s, beat };
  });
  const pics = [];
  if (hasImg) { const p = picture(root, sc.image, 1160, top - 40, 660, sc.caption ? 560 : 640, { fit: sc.fit, frame: sc.frame, auto: sc.fit !== 'cover' }); items.push({ el: p.box, beat: 1, bump: true }); pics.push(p); }
  if (sc.caption) items.push({ el: div('caption', '', `<b>${sc.captionTag || 'RESULT'}</b><span>${rich(sc.caption)}</span>`, root), beat: sc.captionBeat ?? 2 + n * 2 });
  const kb = kenBurns(pics);
  return (t, b, dur) => {
    kb(t, b, dur);
    counters.forEach(({ span, s, beat }) => {
      const target = String(s.value), num = parseFloat(target.replace(/[^\d.\-]/g, ''));
      if (isNaN(num) || s.count === false) { span.textContent = target; return; }
      const dec = (target.split('.')[1] || '').replace(/\D.*/, '').length;
      const from = s.from ?? 0, p = ease(ramp(b, beat - 1, beat));
      const prefix = target.match(/^[^\d\-.]*/)[0], v = from + (num - from) * p;
      span.textContent = prefix + v.toFixed(dec);
    });
  };
};

B.end = (sc, root, items) => {
  const col = div('', 'position:absolute;left:100px;top:0;bottom:0;width:' + (sc.image ? 960 : 1600) + 'px;display:flex;flex-direction:column;justify-content:center', null, root);
  items.push({ el: div('', `font-size:${sc.size || 72}px;font-weight:800;letter-spacing:-.025em;line-height:1.1`, rich(sc.line), col), beat: 0 });
  if (sc.sub) items.push({ el: div('', 'font-size:30px;line-height:1.45;color:var(--muted);margin-top:36px', rich(sc.sub), col), beat: 4 });
  if (sc.cite) items.push({ el: div('', 'font-size:22px;line-height:1.5;color:var(--muted);margin-top:48px', rich(sc.cite), col), beat: 6 });
  items.push({ el: div('', 'position:absolute;left:100px;bottom:44px;width:1500px;font-size:17px;line-height:1.4;color:#8a9592', rich(SPEC.timing.credit), root), beat: 8 });
  const pics = [];
  if (sc.image) { const p = picture(root, sc.image, 1120, 160, 700, 760, { fit: sc.fit, frame: sc.frame, auto: sc.fit !== 'cover' }); items.push({ el: p.box, beat: 0, bump: true }); pics.push(p); }
  return kenBurns(pics);
};

B.anim = (sc, root, items) => {
  header(root, sc, items);
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', 1920); svg.setAttribute('height', 1080); svg.setAttribute('viewBox', '0 0 1920 1080');
  svg.style.cssText = 'position:absolute;left:0;top:0;overflow:visible';
  root.appendChild(svg);
  if (sc.caption) items.push({ el: div('caption', '', `<b>${sc.captionTag || 'TAKEAWAY'}</b><span>${rich(sc.caption)}</span>`, root), beat: sc.captionBeat ?? 8 });
  const fn = ANIMS[sc.anim];
  if (!fn) { div('', 'position:absolute;left:100px;top:400px;font-size:40px;color:red', 'missing animation: ' + sc.anim, root); return; }
  return fn({ root, svg, sc, items, H });
};

/* video clip from the project's own footage; frame-locked to the timeline (see renderAt / seekWait) */
const CLIPS = [];
B.clip = (sc, root, items) => {
  header(root, sc, items);
  const top = sc.head ? 230 : 120, h = (sc.caption ? 900 : 1010) - top, w = Math.min(1720, h * 16 / 9), x = 100 + (1720 - w) / 2;
  const box = div('imgbox', `left:${x}px;top:${top}px;width:${w}px;height:${h}px;background:#000`, null, root);
  const v = document.createElement('video');
  v.src = ASSETS[sc.video] || sc.video; v.muted = true; v.playsInline = true; v.preload = 'auto';
  v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
  box.appendChild(v);
  items.push({ el: box, beat: 0 });
  if (sc.caption) items.push({ el: div('caption', '', `<b>${sc.captionTag || 'TAKEAWAY'}</b><span>${rich(sc.caption)}</span>`, root), beat: sc.captionBeat ?? 4 });
  const clip = { v, target: sc.from || 0, active: false };
  CLIPS.push(clip);
  return t => { clip.target = (sc.from || 0) + t * (sc.rate || 1); clip.active = true; };
};

/* ---------- assemble ---------- */
const scenes = [];
let cursor = 0;
SPEC.scenes.forEach((sc, i) => {
  const root = div('scene', '');
  const items = [];
  const update = B[sc.type](sc, root, items) || (() => {});
  const bars = sc.bars;
  const last = i === SPEC.scenes.length - 1;
  const dur = bars * 4 * BEAT + (last ? SPEC.timing.tail : 0);
  scenes.push({ root, items, update, start: cursor, end: cursor + dur, last, sc });
  cursor += bars * 4 * BEAT;
});
stage.appendChild(document.getElementById('flash'));
const HIT = cursor;                                   // the track's final hit lands here
const TOTAL = cursor + SPEC.timing.tail;

let pendingSeeks = [];
function renderAt(t) {
  CLIPS.forEach(c => { c.active = false; });
  scenes.forEach((s, i) => {
    const lt = t - s.start, dur = s.end - s.start, b = lt / BEAT;
    const fin = i === 0 ? 1 : ease(ramp(lt, -.02, .18));
    const fout = s.last ? 1 : 1 - ease(ramp(lt, dur - .2, dur - .02));
    const o = lt >= -.02 && lt <= dur ? fin * fout : 0;
    s.root.style.opacity = o;
    if (o <= 0) return;
    s.root.style.transform = `scale(${1 + .025 * (1 - ease(ramp(lt, 0, .35)))})`;
    s.items.forEach(({ el, beat, bump }) => {
      const a = beat * BEAT, p = back(ramp(lt, a - .14, a + .16));
      el.style.opacity = clamp(ramp(lt, a - .14, a + .02));
      const base = el.classList.contains('callout') ? 'translate(-50%,-50%) ' : '';
      el.style.transform = base + `translateY(${(1 - p) * 22}px) scale(${.965 + .035 * p + (bump ? .01 * kick(b) : 0)})`;
    });
    s.update(lt, b, dur);
  });
  syncClips();
  const h = t - HIT;
  document.getElementById('flash').style.opacity = h >= -.03 ? .35 * Math.exp(-Math.max(0, h) * 2.2) : 0;
}
window.renderAt = renderAt; window.TOTAL = TOTAL;
// Capture seeks every clip to its exact frame and waits; playback lets clips run and only corrects drift.
function syncClips() {
  pendingSeeks = [];
  CLIPS.forEach(c => {
    if (capture) {
      if (Math.abs(c.v.currentTime - c.target) > .001) {
        pendingSeeks.push(new Promise(r => c.v.addEventListener('seeked', r, { once: true })));
        c.v.currentTime = c.target;
      }
    } else if (c.active && playing) {
      if (Math.abs(c.v.currentTime - c.target) > .15) c.v.currentTime = c.target;
      if (c.v.paused) c.v.play().catch(() => {});
    } else {
      if (!c.v.paused) c.v.pause();
      if (!playing && Math.abs(c.v.currentTime - c.target) > .05) c.v.currentTime = c.target;
    }
  });
}
window.seekWait = () => Promise.all(pendingSeeks);

const capture = new URLSearchParams(location.search).has('capture');
if (capture) document.body.classList.add('capture');
function fit() {
  const h = innerHeight - (capture ? 0 : 56);
  stage.style.transform = `translate(-50%,-50%) scale(${Math.min(innerWidth / 1920, h / 1080)})`;
  stage.style.top = h / 2 + 'px';
}
addEventListener('resize', fit); fit();
const music = document.getElementById('music'), scrub = document.getElementById('scrub'), playBtn = document.getElementById('play'), timeEl = document.getElementById('time');
let playing = false, now = 0;
function seek(t) { now = t; try { music.currentTime = t; } catch (e) {} draw(); }
function draw() { renderAt(now); scrub.value = now / TOTAL * 1000; timeEl.textContent = now.toFixed(1) + ' s'; }
function setPlaying(p) {
  playing = p; playBtn.textContent = p ? '❚❚' : '▶'; document.getElementById('start').style.display = 'none';
  if (p) { if (now >= TOTAL - .05) seek(0); music.play().catch(() => {}); } else music.pause();
}
(function loop() {
  if (playing) { now = music.currentTime; if (music.ended || now >= TOTAL) { setPlaying(false); now = TOTAL; } draw(); }
  requestAnimationFrame(loop);
})();
playBtn.onclick = () => setPlaying(!playing);
document.getElementById('start').onclick = () => setPlaying(true);
scrub.oninput = () => seek(scrub.value / 1000 * TOTAL);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); } });
renderAt(0);
</script>
</body>
